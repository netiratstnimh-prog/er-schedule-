<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MedCrew | Admin</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,sans-serif;
  background:#f2f8f8;
  color:#16343a
}
header{
  background:#087e83;
  color:white;
  padding:28px 18px;
  text-align:center
}
header h1{margin:0;font-size:30px}
header p{margin:7px 0 0}

main{
  max-width:650px;
  margin:24px auto;
  padding:0 16px
}

.panel{
  background:white;
  border-radius:18px;
  padding:22px;
  box-shadow:0 5px 25px #1232
}

.card{
  border:1px solid #d5e4e5;
  border-radius:15px;
  padding:17px;
  margin-top:15px
}

.card h3{margin:0 0 12px}

.row{
  margin:7px 0;
  overflow-wrap:anywhere
}

.badge{
  display:inline-block;
  padding:5px 10px;
  border-radius:20px;
  background:#fff1c9;
  color:#775800;
  font-weight:700
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px
}

button{
  border:0;
  padding:12px;
  border-radius:10px;
  font:inherit;
  font-weight:700;
  cursor:pointer
}

.approve{
  background:#087e83;
  color:white
}

.reject{
  background:#f2e5e5;
  color:#9b2929
}

button:disabled{opacity:.5}

.status{
  margin:14px 0;
  padding:12px;
  background:#edf5f5;
  border-radius:10px;
  white-space:pre-wrap;
  overflow-wrap:anywhere
}

.status:empty{display:none}

a{color:#087e83}
[hidden]{display:none!important}
</style>
</head>

<body>

<header>
  <h1>♡ MedCrew</h1>
  <p>Admin Dashboard</p>
</header>

<main>
<div class="panel">

<h2>ตรวจสอบนายจ้าง</h2>

<div id="loading">
  กำลังตรวจสอบสิทธิ์แอดมิน...
</div>

<div id="loginNotice" hidden>
  <p>กรุณาเข้าสู่ระบบด้วยบัญชีแอดมิน</p>
  <p><a href="./register.html">เข้าสู่ระบบ</a></p>
</div>

<div id="denied" hidden>
  <p>⛔ บัญชีนี้ไม่มีสิทธิ์เข้าถึง Admin Dashboard</p>
</div>

<div id="adminArea" hidden>
  <p>บัญชีผู้ดูแลระบบได้รับการยืนยันแล้ว ✓</p>
  <div id="requests"></div>
</div>

<div id="status" class="status"
     role="status"
     aria-live="polite"></div>

<p><a href="./index.html">← กลับหน้าแรก</a></p>

</div>
</main>

<script type="module">

const SUPABASE_URL =
'https://chmkujuiqodkiptcjseq.supabase.co';

const SUPABASE_KEY =
'sb_publishable_5CpOijQGj5k9JLbSAxLaiQ_-cDKlmgu';

const $ = id => document.getElementById(id);

const message = text => {
  $('status').textContent = text;
};

let db;
let currentUser;

function escapeHTML(value){
  return String(value ?? '')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#039;");
}

async function checkAdmin(){

  const {data:{user},error} =
    await db.auth.getUser();

  if(error &&
     error.name !== 'AuthSessionMissingError'){
    throw error;
  }

  $('loading').hidden = true;

  if(!user){
    $('loginNotice').hidden = false;
    return;
  }

  currentUser = user;

  const {data,error:adminError} =
    await db
      .from('admin_users')
      .select('user_id')
      .eq('user_id',user.id)
      .maybeSingle();

  if(adminError) throw adminError;

  if(!data){
    $('denied').hidden = false;
    return;
  }

  $('adminArea').hidden = false;

  await loadRequests();
}

async function loadRequests(){

  message('กำลังโหลดคำขอ...');

  const {data,error} =
    await db
      .from('employer_verifications')
      .select(`
        user_id,
        organization_name,
        organization_type,
        contact_name,
        contact_phone,
        contact_email,
        registration_number,
        status,
        submitted_at
      `)
      .eq('status','pending')
      .order('submitted_at',{
        ascending:true
      });

  if(error) throw error;

  const box = $('requests');
  box.innerHTML = '';

  if(!data || data.length === 0){
    box.innerHTML =
      '<p>ไม่มีคำขอยืนยันตัวตนที่รอตรวจสอบ 🎉</p>';
    message('');
    return;
  }

  for(const item of data){

    const card =
      document.createElement('div');

    card.className = 'card';

    card.innerHTML = `
      <h3>${escapeHTML(item.organization_name)}</h3>

      <div class="row">
        <span class="badge">รอตรวจสอบ</span>
      </div>

      <div class="row">
        <strong>ประเภท:</strong>
        ${escapeHTML(item.organization_type)}
      </div>

      <div class="row">
        <strong>ผู้ติดต่อ:</strong>
        ${escapeHTML(item.contact_name)}
      </div>

      <div class="row">
        <strong>โทร:</strong>
        ${escapeHTML(item.contact_phone)}
      </div>

      <div class="row">
        <strong>อีเมล:</strong>
        ${escapeHTML(item.contact_email || '-')}
      </div>

      <div class="row">
        <strong>เลขทะเบียน:</strong>
        ${escapeHTML(item.registration_number || '-')}
      </div>

      <div class="actions">
        <button
          class="approve"
          data-action="verified">
          ✓ อนุมัติ
        </button>

        <button
          class="reject"
          data-action="rejected">
          ✕ ปฏิเสธ
        </button>
      </div>
    `;

    const buttons =
      card.querySelectorAll('button');

    buttons.forEach(button => {

      button.addEventListener(
        'click',
        async () => {

          const decision =
            button.dataset.action;

          const text =
            decision === 'verified'
            ? 'อนุมัติ'
            : 'ปฏิเสธ';

          const confirmed =
            confirm(
              `ยืนยันว่าจะ${text} ${item.organization_name} ?`
            );

          if(!confirmed) return;

          buttons.forEach(b =>
            b.disabled = true
          );

          message(
            `กำลัง${text}คำขอ...`
          );

          try{

            const {error} =
              await db.rpc(
                'review_employer',
                {
                  p_user_id:item.user_id,
                  p_decision:decision
                }
              );

            if(error) throw error;

            message(
              `${text}คำขอสำเร็จ`
            );

            await loadRequests();

          }catch(error){

            message(
              'เกิดข้อผิดพลาด: ' +
              (error?.message ||
               String(error))
            );

            buttons.forEach(b =>
              b.disabled = false
            );
          }
        }
      );
    });

    box.appendChild(card);
  }

  message('');
}

try{

  const {createClient} =
    await import(
      'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
    );

  db = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  await checkAdmin();

}catch(error){

  $('loading').hidden = true;

  message(
    'เกิดข้อผิดพลาด: ' +
    (error?.message ||
     String(error))
  );
}

</script>

</body>
</html>
