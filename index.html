<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบันทึกรายการค่าใช้จ่าย & พิมพ์สลิป</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- html2pdf.js สำหรับสร้าง PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- Google Font (Courier Prime สำหรับสไตล์สลิป & Sarabun) -->
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f1f5f9;
        }

        /* สำหรับแต่งทรงกระดาษสลิป ATM (80mm Thermal Receipt Style) */
        .slip-paper {
            width: 80mm;
            min-height: 120mm;
            padding: 8mm 6mm;
            background: #ffffff;
            font-family: 'Courier Prime', 'Sarabun', monospace;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        /* เอฟเฟกต์รอยหยักก้นสลิป */
        .slip-zigzag {
            background: radial-gradient(circle, transparent, transparent 50%, #ffffff 50%, #ffffff 100%);
            background-size: 10px 10px;
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 pb-10">

    <!-- Header Navigation -->
    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-30">
        <div class="max-w-5xl mx-auto px-4 py-3.5 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-receipt text-amber-400 text-2xl"></i>
                <h1 class="text-lg font-bold tracking-wide">Expense Slip Generator</h1>
            </div>
            <div class="text-xs bg-slate-800 px-3 py-1.5 rounded-full text-slate-300 border border-slate-700">
                <i class="fa-regular fa-clock mr-1 text-amber-400"></i> <span id="current-date"></span>
            </div>
        </div>
    </header>

    <!-- Main Dashboard -->
    <main class="max-w-5xl mx-auto px-4 mt-6 grid grid-cols-1 md:grid-cols-12 gap-6">

        <!-- ฝั่งซ้าย: ฟอร์มป้อนข้อมูล & ตารางสรุป (7 Cols) -->
        <div class="md:col-span-7 space-y-6">

            <!-- Card 1: ฟอร์มเพิ่มรายการ -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-base font-bold text-slate-800 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-pen text-amber-500"></i> บันทึกรายการค่าใช้จ่าย
                </h2>
                <form id="expense-form" onsubmit="addItem(event)" class="space-y-4">
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div class="sm:col-span-2">
                            <label class="block text-xs font-semibold text-slate-600 mb-1">รายละเอียดรายการ</label>
                            <input type="text" id="item-title" required placeholder="เช่น ค่ากาแฟ, ค่าถอนเงิน, ค่าเดินทาง" class="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-slate-800 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">จำนวนเงิน (บาท)</label>
                            <input type="number" id="item-amount" step="0.01" min="0.01" required placeholder="0.00" class="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-slate-800 outline-none">
                        </div>
                    </div>

                    <button type="submit" class="w-full py-2.5 bg-slate-900 hover:bg-slate-800 text-white font-medium text-sm rounded-lg shadow transition-all flex justify-center items-center gap-2">
                        <i class="fa-solid fa-plus text-xs"></i> เพิ่มรายการ
                    </button>
                </form>
            </div>

            <!-- Card 2: ตารางรายการที่บันทึก -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-3.5 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                    <h3 class="font-bold text-sm text-slate-700">รายการทั้งหมด</h3>
                    <button onclick="clearAllItems()" class="text-xs text-rose-600 hover:underline flex items-center gap-1">
                        <i class="fa-solid fa-trash-can"></i> ล้างข้อมูล
                    </button>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm text-slate-600">
                        <thead class="bg-slate-100 text-slate-500 uppercase text-xs">
                            <tr>
                                <th class="p-3 pl-4">#</th>
                                <th class="p-3">รายการ</th>
                                <th class="p-3 text-right">จำนวนเงิน</th>
                                <th class="p-3 text-center">จัดการ</th>
                            </tr>
                        </thead>
                        <tbody id="expense-table-body" class="divide-y divide-slate-100">
                            <!-- รายการสร้างผ่าน JS -->
                        </tbody>
                    </table>
                </div>

                <!-- สรุปยอดรวมด้านล่างสุด -->
                <div class="p-4 bg-slate-900 text-white flex justify-between items-center">
                    <span class="font-medium text-sm text-slate-300">ยอดรวมทั้งสิ้น:</span>
                    <span id="grand-total" class="font-bold text-amber-400 text-xl">0.00 ฿</span>
                </div>
            </div>

        </div>

        <!-- ฝั่งขวา: พรีวิวสลิป ATM / ใบเสร็จ & ปุ่มดาวน์โหลด (5 Cols) -->
        <div class="md:col-span-5 flex flex-col items-center space-y-4">

            <!-- ปุ่มดาวน์โหลด PDF -->
            <button onclick="exportSlipPDF()" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold text-sm rounded-xl shadow-lg transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-print"></i> พิมพ์ / ออกสลิป PDF
            </button>

            <!-- ตัวอย่างกระดาษสลิป ATM -->
            <div class="w-full flex justify-center overflow-auto p-4 bg-slate-300 rounded-2xl border border-slate-400">
                
                <div id="slip-render-area" class="slip-paper rounded-t-sm text-slate-900 border-t-4 border-slate-900">
                    
                    <!-- Slip Header -->
                    <div class="text-center pb-3 mb-3 border-b border-dashed border-slate-400 space-y-1">
                        <div class="inline-flex items-center justify-center w-8 h-8 bg-slate-900 text-white rounded-full mb-1">
                            <i class="fa-solid fa-receipt text-xs"></i>
                        </div>
                        <h2 class="font-bold text-sm tracking-tighter uppercase">TRANSACTION SLIP</h2>
                        <p class="text-[10px] text-slate-500">ใบบันทึกรายการค่าใช้จ่าย</p>
                        <p class="text-[9px] text-slate-400" id="slip-date-time">-</p>
                    </div>

                    <!-- Slip Body Table -->
                    <table class="w-full text-left text-[11px] mb-3">
                        <thead>
                            <tr class="border-b border-slate-300 text-slate-500">
                                <th class="pb-1">รายการ</th>
                                <th class="pb-1 text-right">จำนวน (บาท)</th>
                            </tr>
                        </thead>
                        <tbody id="slip-table-body" class="divide-y divide-dotted divide-slate-200">
                            <!-- รายการสลิปแบบย่อ -->
                        </tbody>
                    </table>

                    <!-- Slip Summary Total -->
                    <div class="border-t-2 border-slate-900 pt-2 mb-4 space-y-1">
                        <div class="flex justify-between font-bold text-xs">
                            <span>TOTAL:</span>
                            <span id="slip-total-amount">0.00 ฿</span>
                        </div>
                    </div>

                    <!-- Slip Footer & Barcode Effect -->
                    <div class="text-center text-[9px] text-slate-500 space-y-2 pt-2 border-t border-dashed border-slate-300">
                        <p>*** THANK YOU ***</p>
                        <!-- Simulated Barcode -->
                        <div class="font-mono text-xs tracking-widest text-slate-800 font-bold select-none opacity-80">
                            ||| | ||||| || |||| ||| |||
                        </div>
                        <p class="text-[8px] text-slate-400">REF: <span id="slip-ref-code">000000</span></p>
                    </div>

                </div>

            </div>

        </div>

    </main>

    <!-- JavaScript Control Logic -->
    <script>
        let items = [];

        // แสดงเวลาปัจจุบัน
        function updateDateTime() {
            const now = new Date();
            const dateStr = now.toLocaleDateString('th-TH', { year: '2-digit', month: '2-digit', day: '2-digit' });
            const timeStr = now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('current-date').innerText = `${dateStr} ${timeStr}`;
            document.getElementById('slip-date-time').innerText = `DATE: ${dateStr} TIME: ${timeStr}`;
        }
        setInterval(updateDateTime, 1000);
        updateDateTime();

        // สุ่มรหัสอ้างอิงสลิป
        document.getElementById('slip-ref-code').innerText = Math.floor(100000 + Math.random() * 900000);

        // เพิ่มรายการใหม่
        function addItem(e) {
            e.preventDefault();
            const title = document.getElementById('item-title').value;
            const amount = parseFloat(document.getElementById('item-amount').value);

            if (title && amount) {
                items.push({ id: Date.now(), title, amount });
                document.getElementById('expense-form').reset();
                renderItems();
            }
        }

        // ลบรายการ
        function deleteItem(id) {
            items = items.filter(item => item.id !== id);
            renderItems();
        }

        // ล้างรายการทั้งหมด
        function clearAllItems() {
            if (confirm('คุณต้องการลบรายการทั้งหมดใช่หรือไม่?')) {
                items = [];
                renderItems();
            }
        }

        // คำนวณยอดรวม และแสดงผลลงตาราง + สลิป
        function renderItems() {
            const tableBody = document.getElementById('expense-table-body');
            const slipTableBody = document.getElementById('slip-table-body');
            
            tableBody.innerHTML = '';
            slipTableBody.innerHTML = '';

            let total = 0;

            if (items.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="4" class="text-center py-6 text-slate-400">ไม่มีรายการ</td></tr>`;
                slipTableBody.innerHTML = `<tr><td colspan="2" class="text-center py-3 text-slate-400">NO ITEMS</td></tr>`;
            } else {
                items.forEach((item, index) => {
                    total += item.amount;
                    const formattedAmount = item.amount.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

                    // Render ลง Dashboard Table
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-slate-50";
                    tr.innerHTML = `
                        <td class="p-3 pl-4 font-medium text-slate-400">${index + 1}</td>
                        <td class="p-3 font-medium text-slate-800">${item.title}</td>
                        <td class="p-3 text-right font-bold text-slate-700">${formattedAmount}</td>
                        <td class="p-3 text-center">
                            <button onclick="deleteItem(${item.id})" class="text-slate-400 hover:text-rose-600 transition-colors">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </td>
                    `;
                    tableBody.appendChild(tr);

                    // Render ลง Slip Table
                    const slipTr = document.createElement('tr');
                    slipTr.innerHTML = `
                        <td class="py-1.5 pr-2 truncate max-w-[120px]">${item.title}</td>
                        <td class="py-1.5 text-right font-bold">${formattedAmount}</td>
                    `;
                    slipTableBody.appendChild(slipTr);
                });
            }

            // แสดงยอดรวม
            const formattedTotal = total.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' ฿';
            document.getElementById('grand-total').innerText = formattedTotal;
            document.getElementById('slip-total-amount').innerText = formattedTotal;
        }

        // ส่งออกสลิปเป็นไฟล์ PDF ขนาดกระดาษสลิป (80mm)
        function exportSlipPDF() {
            const element = document.getElementById('slip-render-area');

            const opt = {
                margin:       0,
                filename:     `Expense_Slip_${Date.now()}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 3 }, // เรนเดอร์ความละเอียดสูงให้สลิปชัด
                jsPDF:        { unit: 'mm', format: [80, 160], orientation: 'portrait' } // กำหนดขนาดหน้ากระดาษสลิป 80mm x 160mm
            };

            html2pdf().set(opt).from(element).save();
        }

        // เริ่มต้นเรนเดอร์
        renderItems();
    </script>
</body>
</html>
