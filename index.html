<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday NETIRAT</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&family=Pacifico&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif;
            background-color: #ffffff;
            color: #333;
            overflow: hidden; /* ซ่อน scrollbar */
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }

        /* ---------------- แถบตัวหนังสือวิ่งด้านบน ---------------- */
        .marquee-container {
            width: 100%;
            background-color: #ff9ff3; /* สีชมพูพาสเทล */
            color: #fff;
            padding: 10px 0;
            position: fixed;
            top: 0;
            z-index: 10;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .marquee-text {
            display: inline-block;
            white-space: nowrap;
            animation: marquee 15s linear infinite;
            font-size: 1.2rem;
            font-weight: 600;
        }
        @keyframes marquee {
            0% { transform: translateX(100vw); }
            100% { transform: translateX(-100%); }
        }

        /* ---------------- คอนเทนเนอร์หลัก ---------------- */
        .container {
            margin-top: 60px;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
        }

        /* ---------------- หน้าแรก (Scene 1) ---------------- */
        #scene1 {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .candles {
            font-size: 3.5rem;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .hbd-text {
            font-family: 'Pacifico', cursive;
            font-size: 2.8rem;
            opacity: 0;
            /* แต่งสีตัวอักษรแบบไล่สี */
            background: linear-gradient(45deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: popUp 2s ease-out forwards;
            animation-delay: 4s; /* หน่วงเวลา 4 วินาทีก่อนเด้งขึ้นมา */
            margin-bottom: 30px;
            padding: 0 20px;
            line-height: 1.4;
        }

        @keyframes popUp {
            0% { opacity: 0; transform: translateY(50px) scale(0.8); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .btn {
            background-color: #feca57;
            color: #fff;
            border: none;
            padding: 15px 35px;
            font-size: 1.2rem;
            font-family: 'Kanit', sans-serif;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(254, 202, 87, 0.5);
            transition: transform 0.2s, background-color 0.2s;
            opacity: 0;
            animation: fadeIn 1s ease-out forwards;
            animation-delay: 5.5s; /* ปุ่มเด้งขึ้นมาหลังข้อความเล็กน้อย */
        }
        
        .btn:hover {
            transform: scale(1.05);
            background-color: #ff9f43;
        }

        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        /* ---------------- เอฟเฟกต์ผ้าม่าน (Curtain) ---------------- */
        .curtain {
            position: fixed;
            top: 0;
            width: 50vw;
            height: 100vh;
            background-color: #ff9ff3;
            z-index: 50;
            transition: transform 1.5s ease-in-out; /* ความเร็วตอนปิดม่าน */
        }
        .curtain-left {
            left: 0;
            transform: translateX(-100%);
            border-right: 3px solid #f368e0;
        }
        .curtain-right {
            right: 0;
            transform: translateX(100%);
            border-left: 3px solid #f368e0;
        }

        .curtain.close-left { transform: translateX(0); }
        .curtain.close-right { transform: translateX(0); }

        /* ---------------- หน้าที่สอง (Scene 2 - ฟอร์มอวยพร) ---------------- */
        #scene2 {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 90%;
            max-width: 400px;
            z-index: 10;
        }

        .box-title {
            font-size: 1.5rem;
            color: #ff6b6b;
            margin-bottom: 20px;
            font-weight: 600;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 15px;
            border: 2px solid #48dbfb;
            border-radius: 15px;
            font-family: 'Kanit', sans-serif;
            font-size: 1rem;
            resize: none;
            outline: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }
        
        textarea:focus {
            border-color: #0abde3;
        }

        .btn-submit {
            margin-top: 20px;
            background-color: #48dbfb;
            box-shadow: 0 4px 15px rgba(72, 219, 251, 0.4);
            opacity: 1;
            animation: none; /* ยกเลิก animation ของปุ่มหน้าแรก */
        }
        .btn-submit:hover {
            background-color: #0abde3;
        }
    </style>
</head>
<body>

    <div class="marquee-container">
        <div class="marquee-text">🎂 27 มิถุนายน สุขสันต์วันเกิดให้กับ เนติราช 🎉 ขอให้มีความสุขมากๆ นะ! 🎁</div>
    </div>

    <div class="curtain curtain-left" id="curtainLeft"></div>
    <div class="curtain curtain-right" id="curtainRight"></div>

    <div class="container">
        <div id="scene1">
            <div class="candles">🕯️🎂✨🕯️</div>
            <div class="hbd-text">Happy birthday<br>to NETIRAT</div>
            <button class="btn" onclick="startTransition()">กดอวยพร</button>
        </div>

        <div id="scene2">
            <div class="box-title">ส่งคำอวยพรให้เนติราช 💌</div>
            <form action="https://formspree.io/f/เปลี่ยนตรงนี้เป็น_ID_ของคุณ" method="POST" id="wishForm">
                <input type="hidden" name="_subject" value="🎉 มีคำอวยพรวันเกิดใหม่จากเพื่อน!">
                <textarea name="message" placeholder="พิมพ์คำอวยพรของคุณที่นี่..." required></textarea>
                <button type="submit" class="btn btn-submit">ส่งคำอวยพร</button>
            </form>
        </div>
    </div>

    <script>
        function startTransition() {
            const curtainLeft = document.getElementById('curtainLeft');
            const curtainRight = document.getElementById('curtainRight');
            const scene1 = document.getElementById('scene1');
            const scene2 = document.getElementById('scene2');

            // 1. ปิดผ้าม่านเข้าหากัน
            curtainLeft.classList.add('close-left');
            curtainRight.classList.add('close-right');

            // 2. รอ 1.5 วินาทีให้ม่านปิดสนิท แล้วสลับจากหน้า 1 ไปหน้า 2 
            setTimeout(() => {
                scene1.style.display = 'none';
                scene2.style.display = 'flex';
                
                // 3. ปิดม่านแช่ไว้สักพัก แล้วค่อยเปิดออก (รวมเวลาทั้งหมดประมาน 3-4 วินาที)
                setTimeout(() => {
                    curtainLeft.classList.remove('close-left');
                    curtainRight.classList.remove('close-right');
                }, 1500); // แช่ม่านไว้ 1.5 วิ ก่อนเปิด

            }, 1500); // ระยะเวลาที่ม่านกำลังเคลื่อนที่มาปิด
        }
    </script>
</body>
</html>
