<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday NETIRAT</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif;
            background-color: #fdfdfd; /* สีขาวออฟไวท์ */
            color: #333;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }

        /* ---------------- แถบตัวหนังสือวิ่งด้านบน (Minimal) ---------------- */
        .marquee-container {
            width: 100%;
            background-color: #fff;
            color: #8c734b; /* สีทองหม่น */
            padding: 12px 0;
            position: fixed;
            top: 0;
            z-index: 10;
            border-bottom: 1px solid #eee;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }
        .marquee-text {
            display: inline-block;
            white-space: nowrap;
            animation: marquee 15s linear infinite;
            font-size: 1.1rem;
            font-weight: 400;
            letter-spacing: 1px;
        }
        @keyframes marquee {
            0% { transform: translateX(100vw); }
            100% { transform: translateX(-100%); }
        }

        /* ---------------- คอนเทนเนอร์หลัก ---------------- */
        .container {
            margin-top: 60px;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
        }

        /* ---------------- หน้าแรก (Scene 1) ---------------- */
        #scene1 {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .candles {
            font-size: 3rem;
            margin-bottom: 15px;
            animation: float 4s ease-in-out infinite;
            filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.4)); /* เรืองแสงสีทองอ่อนๆ */
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .hbd-text {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            opacity: 0;
            color: #2c3e50; /* สีเทาเข้มเรียบหรู */
            animation: elegantReveal 2.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            animation-delay: 4s; /* หน่วงเวลา 4 วินาที */
            margin-bottom: 40px;
            line-height: 1.3;
        }
        .hbd-text span {
            color: #d4af37; /* เน้นชื่อสีทอง */
        }

        @keyframes elegantReveal {
            0% { opacity: 0; transform: translateY(30px) scale(0.95); filter: blur(5px); }
            100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }

        .btn {
            background: linear-gradient(135deg, #d4af37, #aa8529);
            color: #fff;
            border: none;
            padding: 12px 40px;
            font-size: 1.1rem;
            font-family: 'Kanit', sans-serif;
            font-weight: 300;
            letter-spacing: 1px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.3);
            transition: all 0.3s ease;
            opacity: 0;
            animation: fadeIn 1.5s ease-out forwards;
            animation-delay: 5.5s;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(212, 175, 55, 0.5);
        }

        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        /* ---------------- เอฟเฟกต์เปลี่ยนหน้า (Cinematic Wipe) ---------------- */
        .curtain-overlay {
            position: fixed;
            top: 100%;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #2c3e50; /* สีเทาเข้มตัดอารมณ์ให้ตลึง */
            z-index: 50;
            transition: top 1.2s cubic-bezier(0.77, 0, 0.175, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #d4af37;
            font-size: 2rem;
            font-family: 'Playfair Display', serif;
        }
        .curtain-overlay.active {
            top: 0;
        }
        .curtain-overlay.exit {
            top: -100%;
        }

        /* ---------------- หน้าที่สอง (Scene 2) ---------------- */
        #scene2 {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 90%;
            max-width: 400px;
            z-index: 10;
        }

        .box-title {
            font-size: 1.4rem;
            color: #555;
            margin-bottom: 25px;
            font-weight: 400;
        }

        textarea {
            width: 100%;
            height: 160px;
            padding: 20px;
            border: 1px solid #e0e0e0;
            background-color: #fff;
            border-radius: 12px;
            font-family: 'Kanit', sans-serif;
            font-size: 1rem;
            resize: none;
            outline: none;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.02);
            transition: border 0.3s;
            box-sizing: border-box;
        }
        
        textarea:focus {
            border-color: #d4af37;
        }

        .btn-submit {
            margin-top: 25px;
            background: #2c3e50;
            box-shadow: 0 10px 20px rgba(44, 62, 80, 0.2);
            opacity: 1;
            animation: none;
        }
        .btn-submit:hover {
            background: #1a252f;
        }
    </style>
</head>
<body>

    <div class="marquee-container">
        <div class="marquee-text">✨ 27 มิถุนายน สุขสันต์วันเกิดให้กับ เนติราช ขอให้เป็นปีที่เต็มไปด้วยรอยยิ้มและความสุข ✨</div>
    </div>

    <div class="curtain-overlay" id="curtain">Make a wish... 🕯️</div>

    <audio id="bgMusic" loop>
        <source src="hbd-piano.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <div id="scene1">
            <div class="candles">🎂</div>
            <div class="hbd-text">Happy birthday<br>to <span>NETIRAT</span></div>
            <button class="btn" onclick="startTransition()">กดอวยพร</button>
        </div>

        <div id="scene2">
            <div class="box-title">ส่งคำอวยพรให้เนติราช 🤍</div>
            <form action="https://formspree.io/f/เปลี่ยนตรงนี้เป็น_ID_ของคุณ" method="POST">
                <input type="hidden" name="_subject" value="🎉 มีคำอวยพรวันเกิดใหม่!">
                <textarea name="message" placeholder="เขียนความรู้สึกดีๆ ถึงเนติราช..." required></textarea>
                <button type="submit" class="btn btn-submit">ส่งคำอวยพร</button>
            </form>
        </div>
    </div>

    <script>
        function startTransition() {
            const curtain = document.getElementById('curtain');
            const scene1 = document.getElementById('scene1');
            const scene2 = document.getElementById('scene2');
            const music = document.getElementById('bgMusic');

            // 1. เล่นเพลง (เพลงจะเล่นได้ก็ต่อเมื่อผู้ใช้กดปุ่มแล้วเท่านั้น)
            music.play().catch(error => console.log("เบราว์เซอร์ไม่อนุญาตให้เล่นเสียงอัตโนมัติ"));

            // 2. ปาดหน้าจอขึ้นมาปิด (Cinematic Wipe)
            curtain.classList.add('active');

            // 3. รอให้หน้าจอปิดสนิท (1.2 วิ) แล้วสลับหน้า
            setTimeout(() => {
                scene1.style.display = 'none';
                scene2.style.display = 'flex';
                
                // 4. แช่หน้า "Make a wish..." ไว้สักพัก แล้วปาดขึ้นไปเปิดหน้าใหม่ (รวม 3-4 วิ)
                setTimeout(() => {
                    curtain.classList.add('exit');
                    
                    // 5. เมื่อเปิดหน้ามา ยิงเอฟเฟกต์พลุกระดาษฉลอง!
                    setTimeout(() => {
                        fireConfetti();
                    }, 500);

                }, 1800);

            }, 1200); 
        }

        // ฟังก์ชันยิงพลุกระดาษสวยๆ
        function fireConfetti() {
            var duration = 3 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                var particleCount = 50 * (timeLeft / duration);
                confetti(Object.assign({}, defaults, { particleCount,
                    origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 }
                }));
                confetti(Object.assign({}, defaults, { particleCount,
                    origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 }
                }));
            }, 250);
        }
    </script>
</body>
</html>
