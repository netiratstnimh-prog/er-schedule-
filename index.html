<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบโอนเงิน (จำลอง)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
        }
        h2 {
            color: #333;
            text-align: center;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        .loading {
            display: none;
            text-align: center;
            color: #ff9800;
            font-weight: bold;
            font-size: 18px;
            margin-top: 20px;
        }
        .dashboard {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #eee;
        }
        .data-list {
            background-color: #f8f9fa;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 14px;
            max-height: 150px;
            overflow-y: auto;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="form-section">
        <h2>กรอกข้อมูลเพื่อรับเงิน</h2>
        
        <div class="form-group">
            <label for="account-number">เลขบัญชี / PromptPay</label>
            <input type="text" id="account-number" placeholder="เช่น 012-3-45678-9 หรือ เบอร์โทร">
        </div>
        
        <div class="form-group">
            <label for="amount">จำนวนเงิน (บาท)</label>
            <input type="number" id="amount" placeholder="0.00">
        </div>

        <button type="button" onclick="submitData()">ยืนยันการทำรายการ</button>
    </div>

    <div id="loading-status" class="loading">
        ⏳ กรุณารอสักครู่ ระบบกำลังทำรายการ...
    </div>

    <div class="dashboard">
        <h3>📊 ข้อมูลที่บันทึกไว้ในระบบ</h3>
        <div id="saved-data" class="data-list">ยังไม่มีข้อมูลที่กรอกเข้ามา</div>
    </div>
</div>

<script>
    // ฟังก์ชันดึงข้อมูลเก่าที่เคยบันทึกไว้มาแสดงตอนโหลดหน้าเว็บ
    window.onload = function() {
        displaySavedData();
    };

    function submitData() {
        const account = document.getElementById('account-number').value.trim();
        const amount = document.getElementById('amount').value.trim();

        if (account === "" || amount === "") {
            alert("กรุณากรอกข้อมูลให้ครบถ้วนครับ");
            return;
        }

        // ซ่อนฟอร์มกรอกข้อมูลชั่วคราว
        document.getElementById('form-section').style.display = 'none';
        // แสดงข้อความกำลังทำรายการ
        document.getElementById('loading-status').style.display = 'block';

        // จำลองเวลาการทำงานของระบบ 3 วินาที
        setTimeout(function() {
            // บันทึกข้อมูลลง LocalStorage (เซฟไว้ในเครื่อง)
            saveToStorage(account, amount);

            // ซ่อนข้อความแจ้งเตือน และเคลียร์ค่าในฟอร์ม
            document.getElementById('loading-status').style.display = 'none';
            document.getElementById('form-section').style.display = 'block';
            document.getElementById('account-number').value = '';
            document.getElementById('amount').value = '';

            // แสดงข้อมูลล่าสุดบนหน้าจอ
            displaySavedData();
            
            alert("บันทึกข้อมูลเรียบร้อยแล้ว!");
        }, 3000); // 3000 มิลลิวินาที = 3 วินาที
    }

    function saveToStorage(account, amount) {
        let currentData = JSON.parse(localStorage.getItem('transfer_requests')) || [];
        
        // สร้าง Object ข้อมูลใหม่พร้อมเวลาที่ทำรายการ
        const newData = {
            account: account,
            amount: amount,
            time: new Date().toLocaleString('th-TH')
        };
        
        currentData.unshift(newData); // เอาข้อมูลใหม่ไว้บนสุด
        localStorage.setItem('transfer_requests', JSON.stringify(currentData));
    }

    function displaySavedData() {
        const savedDataBox = document.getElementById('saved-data');
        let currentData = JSON.parse(localStorage.getItem('transfer_requests')) || [];

        if (currentData.length === 0) {
            savedDataBox.innerHTML = "ยังไม่มีข้อมูลที่กรอกเข้ามา";
            return;
        }

        let htmlContent = "";
        currentData.forEach((item, index) => {
            htmlContent += `[${item.time}] <br> เลขบัญชี: <b>${item.account}</b> | จำนวนเงิน: <b>${item.amount} บาท</b><br><hr style="border:0; border-top:1px dashed #ccc;">`;
        });

        savedDataBox.innerHTML = htmlContent;
    }
</script>

</body>
</html>
