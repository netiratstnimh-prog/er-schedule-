<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RN-PN Duty Management</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #020617;
      color: white;
    }

    .glass {
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(255,255,255,.1);
      backdrop-filter: blur(15px);
    }

    .card {
      background: #0f172a;
      border: 1px solid #1e293b;
    }

    input, select {
      background: #020617 !important;
      color: white !important;
      border: 1px solid #334155 !important;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<div id="loginPage"
     class="min-h-screen flex items-center justify-center p-5">

  <div class="glass w-full max-w-md rounded-3xl p-7">

    <div class="text-center mb-8">

      <div class="text-5xl mb-4">
        🔐
      </div>

      <h1 class="text-2xl font-bold">
        RN-PN Duty System
      </h1>

      <p class="text-slate-400 mt-2">
        ระบบจัดการตารางเวรพยาบาลพิเศษ
      </p>

    </div>


    <form id="loginForm">

      <label class="block text-sm text-slate-300 mb-2">
        PIN
      </label>

      <input
        id="pin"
        type="password"
        inputmode="numeric"
        maxlength="8"
        autocomplete="off"
        class="w-full rounded-xl px-4 py-4 text-center text-2xl tracking-widest"
        placeholder="••••">

      <button
        type="submit"
        class="w-full mt-4 py-4 rounded-xl
               bg-cyan-600 hover:bg-cyan-500
               font-bold">

        เข้าสู่ระบบ

      </button>

      <p id="loginMessage"
         class="text-center text-red-400 text-sm mt-4">
      </p>

    </form>


    <div class="mt-6 rounded-xl bg-amber-500/10
                border border-amber-500/20 p-4">

      <p class="text-amber-300 text-xs">
        ⚠️ Demo สำหรับ GitHub Pages
      </p>

      <p class="text-slate-400 text-xs mt-1">
        ไม่ควรใส่ข้อมูลผู้ป่วยหรือข้อมูลลับจริง
      </p>

    </div>

  </div>

</div>


<!-- =========================
     APPLICATION
========================= -->

<div id="app" class="hidden min-h-screen">

  <!-- HEADER -->

  <header class="sticky top-0 z-50
                 bg-slate-950/95
                 border-b border-slate-800">

    <div class="max-w-7xl mx-auto
                px-4 py-4
                flex items-center
                justify-between">

      <div>

        <h1 class="font-bold text-lg">
          RN-PN Duty Management
        </h1>

        <p class="text-xs text-slate-500">
          ระบบจัดการตารางเวร
        </p>

      </div>

      <button
        id="logout"
        class="px-4 py-2 rounded-lg
               bg-red-500/10
               text-red-300">

        🔒 Logout

      </button>

    </div>

  </header>


  <main class="max-w-7xl mx-auto px-4 py-6">


    <!-- STATS -->

    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">

      <div class="card rounded-2xl p-5">

        <p class="text-slate-400 text-sm">
          เวรทั้งหมด
        </p>

        <p id="total"
           class="text-3xl font-bold mt-2">
          0
        </p>

      </div>


      <div class="card rounded-2xl p-5">

        <p class="text-slate-400 text-sm">
          RN วันนี้
        </p>

        <p id="rnToday"
           class="text-3xl font-bold mt-2">
          0
        </p>

      </div>


      <div class="card rounded-2xl p-5">

        <p class="text-slate-400 text-sm">
          PN วันนี้
        </p>

        <p id="pnToday"
           class="text-3xl font-bold mt-2">
          0
        </p>

      </div>


      <div class="card rounded-2xl p-5">

        <p class="text-slate-400 text-sm">
          เวรดึก
        </p>

        <p id="night"
           class="text-3xl font-bold mt-2">
          0
        </p>

      </div>

    </div>


    <!-- NAV -->

    <div class="flex gap-2 mb-6">

      <button
        class="navButton active px-5 py-3 rounded-xl
               bg-cyan-600"
        data-page="schedule">

        📋 ตารางเวร

      </button>


      <button
        class="navButton px-5 py-3 rounded-xl
               bg-slate-800"
        data-page="add">

        ➕ เพิ่มเวร

      </button>

    </div>


    <!-- =========================
         SCHEDULE
    ========================= -->

    <section id="schedulePage">

      <div class="card rounded-2xl p-5 mb-5">

        <div class="grid md:grid-cols-3 gap-4">

          <div>

            <label class="text-sm text-slate-400">
              วันที่
            </label>

            <input
              id="filterDate"
              type="date"
              class="w-full rounded-xl px-3 py-3 mt-1">

          </div>


          <div>

            <label class="text-sm text-slate-400">
              ตำแหน่ง
            </label>

            <select
              id="filterRole"
              class="w-full rounded-xl px-3 py-3 mt-1">

              <option value="">ทั้งหมด</option>
              <option value="RN">RN</option>
              <option value="PN">PN</option>

            </select>

          </div>


          <div>

            <label class="text-sm text-slate-400">
              เวร
            </label>

            <select
              id="filterShift"
              class="w-full rounded-xl px-3 py-3 mt-1">

              <option value="">ทั้งหมด</option>
              <option value="เช้า">เช้า 07–15</option>
              <option value="บ่าย">บ่าย 15–23</option>
              <option value="ดึก">ดึก 19–07</option>
              <option value="OT">OT</option>
              <option value="OFF">OFF</option>

            </select>

          </div>

        </div>

      </div>


      <div id="scheduleList"
           class="space-y-4">
      </div>

    </section>


    <!-- =========================
         ADD
    ========================= -->

    <section id="addPage"
             class="hidden">

      <div class="card rounded-2xl p-6 max-w-3xl">

        <h2 class="text-xl font-bold mb-5">
          เพิ่มเวร
        </h2>


        <form id="addForm"
              class="grid md:grid-cols-2 gap-4">


          <div>

            <label class="text-sm text-slate-400">
              ชื่อ
            </label>

            <input
              id="name"
              required
              maxlength="80"
              class="w-full rounded-xl px-3 py-3 mt-1"
              placeholder="ชื่อบุคลากร">

          </div>


          <div>

            <label class="text-sm text-slate-400">
              ตำแหน่ง
            </label>

            <select
              id="role"
              required
              class="w-full rounded-xl px-3 py-3 mt-1">

              <option value="">
                เลือกตำแหน่ง
              </option>

              <option value="RN">
                RN
              </option>

              <option value="PN">
                PN
              </option>

            </select>

          </div>


          <div>

            <label class="text-sm text-slate-400">
              วันที่
            </label>

            <input
              id="dutyDate"
              type="date"
              required
              class="w-full rounded-xl px-3 py-3 mt-1">

          </div>


          <div>

            <label class="text-sm text-slate-400">
              เวร
            </label>

            <select
              id="shift"
              required
              class="w-full rounded-xl px-3 py-3 mt-1">

              <option value="">
                เลือกเวร
              </option>

              <option value="เช้า">
                เช้า 07:00–15:00
              </option>

              <option value="บ่าย">
                บ่าย 15:00–23:00
              </option>

              <option value="ดึก">
                ดึก 19:00–07:00
              </option>

              <option value="OT">
                OT
              </option>

              <option value="OFF">
                OFF
              </option>

            </select>

          </div>


          <div>

            <label class="text-sm text-slate-400">
              แผนก
            </label>

            <select
              id="ward"
              required
              class="w-full rounded-xl px-3 py-3 mt-1">

              <option value="">
                เลือกแผนก
              </option>

              <option>ICU</option>
              <option>ER</option>
              <option>OR</option>
              <option>IPD</option>
              <option>OPD</option>
              <option>CCU</option>
              <option>VIP Ward</option>

            </select>

          </div>


          <div>

            <label class="text-sm text-slate-400">
              หมายเหตุ
            </label>

            <input
              id="note"
              maxlength="200"
              class="w-full rounded-xl px-3 py-3 mt-1"
              placeholder="ไม่บังคับ">

          </div>


          <div class="md:col-span-2">

            <button
              class="w-full py-4 rounded-xl
                     bg-cyan-600
                     hover:bg-cyan-500
                     font-bold">

              บันทึกเวร

            </button>

          </div>

        </form>

      </div>

    </section>

  </main>

</div>


<script>

/* ========================================
   DEMO CONFIG
======================================== */

// PIN สำหรับทดลอง
const DEMO_PIN = "7391";


// Session 30 นาที
const SESSION_TIME = 30 * 60 * 1000;


// Storage
const STORAGE_KEY = "RN_PN_DUTIES_DEMO";


/* ========================================
   ELEMENTS
======================================== */

const loginPage =
  document.getElementById("loginPage");

const app =
  document.getElementById("app");

const loginForm =
  document.getElementById("loginForm");

const loginMessage =
  document.getElementById("loginMessage");


/* ========================================
   DATE
======================================== */

function today() {

  const d = new Date();

  const year =
    d.getFullYear();

  const month =
    String(d.getMonth() + 1)
      .padStart(2, "0");

  const day =
    String(d.getDate())
      .padStart(2, "0");

  return `${year}-${month}-${day}`;

}


/* ========================================
   SAFE TEXT
======================================== */

function safeText(value) {

  const div =
    document.createElement("div");

  div.textContent =
    String(value ?? "");

  return div.innerHTML;

}


/* ========================================
   STORAGE
======================================== */

function getDuties() {

  try {

    const data =
      localStorage.getItem(
        STORAGE_KEY
      );

    if (!data) {

      return [];

    }

    const parsed =
      JSON.parse(data);

    return Array.isArray(parsed)
      ? parsed
      : [];

  } catch {

    return [];

  }

}


function saveDuties(data) {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
  );

}


/* ========================================
   LOGIN
======================================== */

loginForm.addEventListener(
  "submit",
  function(event) {

    event.preventDefault();

    const entered =
      document
        .getElementById("pin")
        .value
        .trim();


    if (entered === DEMO_PIN) {

      sessionStorage.setItem(
        "RN_PN_LOGIN",
        Date.now()
      );

      loginPage.classList.add(
        "hidden"
      );

      app.classList.remove(
        "hidden"
      );

      loginMessage.textContent = "";

      initialize();

    } else {

      loginMessage.textContent =
        "PIN ไม่ถูกต้อง";

      document
        .getElementById("pin")
        .value = "";

    }

  }
);


/* ========================================
   LOGOUT
======================================== */

document
  .getElementById("logout")
  .addEventListener(
    "click",
    function() {

      sessionStorage.removeItem(
        "RN_PN_LOGIN"
      );

      app.classList.add(
        "hidden"
      );

      loginPage.classList.remove(
        "hidden"
      );

      document
        .getElementById("pin")
        .value = "";

    }
  );


/* ========================================
   SESSION CHECK
======================================== */

function checkSession() {

  const loginTime =
    Number(
      sessionStorage.getItem(
        "RN_PN_LOGIN"
      )
    );


  if (!loginTime) {

    return false;

  }


  if (
    Date.now() - loginTime >
    SESSION_TIME
  ) {

    sessionStorage.removeItem(
      "RN_PN_LOGIN"
    );

    return false;

  }


  return true;

}


/* ========================================
   NAVIGATION
======================================== */

document
  .querySelectorAll(".navButton")
  .forEach(button => {

    button.addEventListener(
      "click",
      function() {

        const page =
          this.dataset.page;


        document
          .getElementById("schedulePage")
          .classList.toggle(
            "hidden",
            page !== "schedule"
          );


        document
          .getElementById("addPage")
          .classList.toggle(
            "hidden",
            page !== "add"
          );


        document
          .querySelectorAll(".navButton")
          .forEach(btn => {

            btn.classList.remove(
              "bg-cyan-600"
            );

            btn.classList.add(
              "bg-slate-800"
            );

          });


        this.classList.remove(
          "bg-slate-800"
        );

        this.classList.add(
          "bg-cyan-600"
        );

      }
    );

  });


/* ========================================
   RENDER
======================================== */

function render() {

  const list =
    document.getElementById(
      "scheduleList"
    );


  const filterDate =
    document.getElementById(
      "filterDate"
    ).value;


  const filterRole =
    document.getElementById(
      "filterRole"
    ).value;


  const filterShift =
    document.getElementById(
      "filterShift"
    ).value;


  let duties =
    getDuties();


  duties =
    duties.filter(duty => {

      if (
        filterDate &&
        duty.date !== filterDate
      ) {

        return false;

      }


      if (
        filterRole &&
        duty.role !== filterRole
      ) {

        return false;

      }


      if (
        filterShift &&
        duty.shift !== filterShift
      ) {

        return false;

      }


      return true;

    });


  if (duties.length === 0) {

    list.innerHTML = `
      <div class="card rounded-2xl p-10 text-center">
        <div class="text-4xl mb-3">📭</div>
        <p class="text-slate-400">
          ยังไม่มีข้อมูลเวร
        </p>
      </div>
    `;

    updateStats();

    return;

  }


  list.innerHTML =
    duties.map(duty => {

      let shiftColor =
        "text-cyan-300";


      if (duty.shift === "ดึก") {
        shiftColor =
          "text-indigo-300";
      }


      if (duty.shift === "OFF") {
        shiftColor =
          "text-green-300";
      }


      return `

        <div class="card rounded-2xl p-5">

          <div class="flex flex-col md:flex-row
                      md:items-center
                      md:justify-between gap-4">

            <div>

              <div class="flex gap-2 mb-2">

                <span class="text-xs
                             bg-slate-700
                             px-2 py-1
                             rounded-lg">

                  ${safeText(duty.role)}

                </span>

                <span class="text-xs
                             text-slate-500">

                  ${safeText(duty.date)}

                </span>

              </div>


              <h3 class="font-bold text-lg">

                ${safeText(duty.name)}

              </h3>


              <p class="text-sm
                        text-slate-400 mt-1">

                ${safeText(duty.ward)}

              </p>

            </div>


            <div class="flex
                        items-center
                        justify-between
                        md:justify-end
                        gap-5">

              <div class="text-right">

                <div class="font-bold
                            ${shiftColor}">

                  ${safeText(duty.shift)}

                </div>


                <div class="text-xs
                            text-slate-500">

                  ${
                    duty.shift === "ดึก"
                      ? "19:00–07:00"
                      : ""
                  }

                </div>

              </div>


              <button
                onclick="deleteDuty('${safeText(duty.id)}')"
                class="px-3 py-2
                       rounded-lg
                       bg-red-500/10
                       text-red-300">

                ลบ

              </button>

            </div>

          </div>


          ${
            duty.note
              ? `
                <div class="mt-4 pt-4
                            border-t
                            border-slate-800
                            text-sm
                            text-slate-400">

                  📝 ${safeText(duty.note)}

                </div>
              `
              : ""
          }

        </div>

      `;

    }).join("");


  updateStats();

}


/* ========================================
   ADD DUTY
======================================== */

document
  .getElementById("addForm")
  .addEventListener(
    "submit",
    function(event) {

      event.preventDefault();


      if (!checkSession()) {

        alert(
          "Session หมดอายุ กรุณาเข้าสู่ระบบใหม่"
        );

        return;

      }


      const name =
        document
          .getElementById("name")
          .value
          .trim();


      const role =
        document
          .getElementById("role")
          .value;


      const date =
        document
          .getElementById("dutyDate")
          .value;


      const shift =
        document
          .getElementById("shift")
          .value;


      const ward =
        document
          .getElementById("ward")
          .value;


      const note =
        document
          .getElementById("note")
          .value
          .trim();


      if (
        !name ||
        !role ||
        !date ||
        !shift ||
        !ward
      ) {

        alert(
          "กรุณากรอกข้อมูลให้ครบ"
        );

        return;

      }


      const duties =
        getDuties();


      duties.push({

        id:
          "DUTY-" +
          Date.now(),

        name,

        role,

        date,

        shift,

        ward,

        note

      });


      saveDuties(duties);


      this.reset();


      document
        .getElementById("dutyDate")
        .value =
        today();


      render();


      document
        .querySelector(
          '[data-page="schedule"]'
        )
        .click();


      alert(
        "เพิ่มเวรเรียบร้อยแล้ว"
      );

    }
  );


/* ========================================
   DELETE
======================================== */

function deleteDuty(id) {

  if (!checkSession()) {

    alert(
      "Session หมดอายุ"
    );

    return;

  }


  const duties =
    getDuties();


  const duty =
    duties.find(
      item =>
        item.id === id
    );


  if (!duty) {
    return;
  }


  const confirmDelete =
    confirm(
      `ต้องการลบเวรของ ${duty.name} หรือไม่?`
    );


  if (!confirmDelete) {
    return;
  }


  const newDuties =
    duties.filter(
      item =>
        item.id !== id
    );


  saveDuties(newDuties);


  render();

}


/* ========================================
   STATS
======================================== */

function updateStats() {

  const duties =
    getDuties();


  const currentDate =
    today();


  document
    .getElementById("total")
    .textContent =
    duties.length;


  document
    .getElementById("rnToday")
    .textContent =
    duties.filter(
      d =>
        d.date === currentDate &&
        d.role === "RN"
    ).length;


  document
    .getElementById("pnToday")
    .textContent =
    duties.filter(
      d =>
        d.date === currentDate &&
        d.role === "PN"
    ).length;


  document
    .getElementById("night")
    .textContent =
    duties.filter(
      d =>
        d.shift === "ดึก"
    ).length;

}


/* ========================================
   FILTER
======================================== */

[
  "filterDate",
  "filterRole",
  "filterShift"
].forEach(id => {

  document
    .getElementById(id)
    .addEventListener(
      "change",
      render
    );

});


/* ========================================
   INITIALIZE
======================================== */

function initialize() {

  document
    .getElementById("dutyDate")
    .value =
    today();


  render();

}


/* ========================================
   AUTO SESSION TIMEOUT
======================================== */

setInterval(
  function() {

    if (
      !app.classList.contains("hidden") &&
      !checkSession()
    ) {

      app.classList.add(
        "hidden"
      );

      loginPage.classList.remove(
        "hidden"
      );

      alert(
        "Session หมดอายุ กรุณาเข้าสู่ระบบใหม่"
      );

    }

  },
  10000
);


/* ========================================
   AUTO LOGIN IF SESSION EXISTS
======================================== */

if (checkSession()) {

  loginPage.classList.add(
    "hidden"
  );

  app.classList.remove(
    "hidden"
  );

  initialize();

}

</script>

</body>
</html>
