<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการตารางเวรพยาบาล (Mobile Enterprise)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            padding: 15px;
            margin: 0;
            color: #333;
        }
        .container {
            max-width: 100%;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2, h3 { text-align: center; color: #007bff; }
        .btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn:hover { background-color: #218838; }
        .table-responsive {
            overflow-x: auto;
            margin-top: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        th { background-color: #007bff; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        /* สีของแต่ละกะ */
        .shift-M { background-color: #fff3cd; color: #856404; font-weight: bold; } /* เช้า */
        .shift-A { background-color: #cce5ff; color: #004085; font-weight: bold; } /* บ่าย */
        .shift-N { background-color: #f8d7da; color: #721c24; font-weight: bold; } /* ดึก */
        .shift-O { background-color: #d4edda; color: #155724; } /* Off */
        .config-group {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🏥 ระบบจัดตารางเวรพยาบาล</h2>
    <p style="text-align:center; font-size:12px; color:gray;">เวอร์ชันประมวลผลบนมือถือ รองรับเงื่อนไขความปลอดภัยคนไข้</p>
    
    <div class="config-group">
        <strong>⚙️ ตั้งค่าความต้องการขั้นต่ำต่อกะ:</strong><br>
        เวรเช้า (M): 2 คน | เวรบ่าย (A): 2 คน | เวรดึก (N): 1 คน
    </div>

    <button class="btn" onclick="generateSchedule()">⚡ กดคำนวณตารางเวร (7 วัน)</button>

    <div id="resultArea" class="table-responsive">
        </div>
</div>

<script>
// ข้อมูลพยาบาลจำลองระดับองค์กร (สามารถเพิ่ม/ลดตรงนี้ได้เลย)
const nurses = [
    { id: 1, name: "พว. สมศรี (Senior)" },
    { id: 2, name: "พว. พรเพ็ญ (Senior)" },
    { id: 3, name: "พว. นภา (Junior)" },
    { id: 4, name: "พว. สุดา (Junior)" },
    { id: 5, name: "พว. สร้อย (Junior)" },
    { id: 6, name: "พว. เกด (Junior)" }
];

const NUM_DAYS = 7;
const SHIFTS = ['M', 'A', 'N', 'O']; // เช้า, บ่าย, ดึก, หยุด

function generateSchedule() {
    let schedule = {}; // เก็บข้อมูลการจัดเวร [nurse_id][day]
    
    // ตัวติดตามสถานะเพื่อเช็คเงื่อนไข (Constraints)
    let lastShift = {}; // เก็บกะล่าสุดของพยาบาลเพื่อป้องกัน Back-to-back
    let nightShiftCount = {}; // นับจำนวนเวรดึกเพื่อความเท่าเทียม
    
    // ตั้งค่าเริ่มต้น
    nurses.forEach(n => {
        schedule[n.id] = Array(NUM_DAYS).fill('O');
        lastShift[n.id] = 'O';
        nightShiftCount[n.id] = 0;
    });

    // วนลูปจัดเวรทีละวัน
    for (let d = 0; d < NUM_DAYS; d++) {
        // ก๊อปปี้รายชื่อพยาบาลมาสลับลำดับ (สุ่มเพื่อความยุติธรรมในแต่ละวัน)
        let availableNurses = [...nurses].sort(() => Math.random() - 0.5);
        
        let assignedMorning = 0;
        let assignedAfternoon = 0;
        let assignedNight = 0;

        // 1. จัดเวรดึกก่อน (N) - ต้องการ 1 คน และเป็นกะที่เงื่อนไขเยอะสุด
        for (let n of availableNurses) {
            if (assignedNight < 1 && lastShift[n.id] !== 'N') { 
                // เงื่อนไของค์กร: ไม่ให้ขึ้นเวรดึกติดต่อกันเกินไป หรือเพิ่งลงดึกมา
                schedule[n.id][d] = 'N';
                lastShift[n.id] = 'N';
                nightShiftCount[n.id]++;
                assignedNight++;
                // เอาออกจากลิสต์ว่างของวันนี้
                availableNurses = availableNurses.filter(nurse => nurse.id !== n.id);
                break;
            }
        }

        // 2. จัดเวรบ่าย (A) - ต้องการ 2 คน
        for (let n of availableNurses) {
            if (assignedAfternoon < 2) {
                // เงื่อนไของค์กร: ถ้าเมื่อวานเป็นเวรดึก (N) วันนี้ห้ามต่อบ่าย (A) เพื่อความปลอดภัย
                if (lastShift[n.id] !== 'N') {
                    schedule[n.id][d] = 'A';
                    lastShift[n.id] = 'A';
                    assignedAfternoon++;
                    availableNurses = availableNurses.filter(nurse => nurse.id !== n.id);
                }
            }
        }

        // 3. จัดเวรเช้า (M) - ต้องการ 2 คน
        for (let n of availableNurses) {
            if (assignedMorning < 2) {
                // เงื่อนไของค์กร: ถ้าเมื่อวานเป็นเวรดึก (N) วันนี้ห้ามต่อเช้า (M) เด็ดขาด (Ergonomic Rule)
                if (lastShift[n.id] !== 'N') {
                    schedule[n.id][d] = 'M';
                    lastShift[n.id] = 'M';
                    assignedMorning++;
                    availableNurses = availableNurses.filter(nurse => nurse.id !== n.id);
                }
            }
        }

        // พยาบาลที่เหลือในวันนั้นจะได้รับสถานะ 'O' (Off/วันหยุด) โดยอัตโนมัติ
        availableNurses.forEach(n => {
            schedule[n.id][d] = 'O';
            lastShift[n.id] = 'O';
        });
    }

    renderTable(schedule);
}

function renderTable(schedule) {
    let html = `<table>`;
    html += `<tr><th>รายชื่อพยาบาล</th>`;
    for(let d=1; d<=NUM_DAYS; d++) {
        html += `<th>วันี่ ${d}</th>`;
    }
    html += `</tr>`;

    nurses.forEach(n => {
        html += `<tr><td style="text-align:left; font-weight:bold;">${n.name}</td>`;
        for(let d=0; d<NUM_DAYS; d++) {
            let shift = schedule[n.id][d];
            let shiftLabel = shift === 'M' ? 'เช้า (M)' : shift === 'A' ? 'บ่าย (A)' : shift === 'N' ? 'ดึก (N)' : 'หยุด (Off)';
            html += `<td class="shift-${shift}">${shiftLabel}</td>`;
        }
        html += `</tr>`;
    });

    html += `</table>`;
    document.getElementById('resultArea').innerHTML = html;
}
</script>

</body>
</html>
