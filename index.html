<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBD NETIRAT - Puppy & Blessing</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            font-family: 'Kanit', sans-serif;
            background-color: #ffffff;
            color: #333;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* --- Header Bar --- */
        .header-bar {
            width: 100%;
            background: #fff;
            padding: 15px;
            text-align: center;
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            font-weight: 600;
            border-bottom: 2px solid #f1f1f1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            z-index: 100;
        }
        .animated-cake { font-size: 1.5rem; animation: shake 2s infinite; display: inline-block; }
        @keyframes shake { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(15deg); } }

        /* --- Footer Marquee --- */
        .footer-marquee {
            width: 100%;
            background: #2c3e50;
            color: #d4af37;
            padding: 10px 0;
            position: fixed;
            bottom: 0;
            z-index: 100;
        }
        .marquee-text {
            display: inline-block;
            white-space: nowrap;
            animation: marquee 15s linear infinite;
            font-size: 1rem;
        }
        @keyframes marquee { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }

        /* --- Main Container --- */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            position: relative;
        }

        /* --- Scene 1: Intro --- */
        #scene1 { display: flex; flex-direction: column; align-items: center; }
        .puppy { font-size: 5rem; margin-bottom: 10px; animation: bounce 2s infinite; }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% {transform: translateY(0);} 40% {transform: translateY(-20px);} 60% {transform: translateY(-10px);} }
        .hbd-main-text { font-family: 'Playfair Display', serif; font-size: 2.5rem; margin-bottom: 30px; color: #2c3e50; }
        .hbd-main-text span { color: #d4af37; }

        /* --- Scene: Transition (Bible Verse) --- */
        #transition-scene {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #2c3e50;
            color: #d4af37;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            z-index: 200;
            text-align: center;
        }
        .verse-ref { font-size: 1.8rem; margin-bottom: 20px; font-weight: 600; }
        .verse-text { font-size: 1.3rem; line-height: 1.6; font-style: italic; font-family: 'Playfair Display', serif; }

        /* --- Scene 2: Wish Form --- */
        #scene2 { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 450px; }
        textarea {
            width: 100%; height: 120px; padding: 15px;
            border: 2px solid #d4af37; border-radius: 15px;
            font-size: 1rem; font-family: 'Kanit', sans-serif;
            margin-bottom: 10px; outline: none;
        }

        /* --- Emoji Keyboard --- */
        .emoji-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .emoji-btn {
            background: #f9f9f9; border: 1px solid #ddd;
            padding: 8px 12px; border-radius: 10px; cursor: pointer;
            font-size: 1.2rem; transition: 0.2s;
        }
        .emoji-btn:active { transform: scale(0.9); background: #eee; }

        /* --- Buttons --- */
        .btn {
            background: #d4af37; color: white; border: none;
            padding: 15px 40px; border-radius: 50px;
            font-size: 1.1rem; cursor: pointer; font-weight: 600;
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
            transition: 0.3s;
        }
        .btn:active { transform: scale(0.95); }
        .btn-send { background: #2c3e50; }

        /* --- Dog Decorative --- */
        .dog-footer { font-size: 2rem; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="header-bar">
        <span class="animated-cake">🎂</span>
        HAPPY BIRTHDAY NETIRAT
        <span class="animated-cake">🕯️</span>
    </div>

    <div class="main-container">
        
        <div id="scene1">
            <div class="puppy">🐶</div>
            <div class="hbd-main-text">Happy Birthday<br><span>NETIRAT</span></div>
            <button class="btn" onclick="goToTransition()">กดอวยพรให้นเนติราช ✨</button>
        </div>

        <div id="transition-scene">
            <div class="verse-ref">สดุดี 20:4</div>
            <div class="verse-text">“ขอพระองค์ประทานตามความปรารถนาแห่งใจของท่าน และทรงให้แผนงานทั้งสิ้นของท่านสำเร็จ”</div>
        </div>

        <div id="scene2">
            <div style="margin-bottom: 15px; color: #555;">เขียนความในใจถึงเนติราช 🤍</div>
            <form action="https://formspree.io/f/xwvdoqjb" method="POST" id="wishForm">
                <textarea id="messageBox" name="message" placeholder="พิมพ์คำอวยพรที่นี่..." required></textarea>
                
                <div class="emoji-bar">
                    <button type="button" class="emoji-btn" onclick="addEmoji('🎂')">🎂</button>
                    <button type="button" class="emoji-btn" onclick="addEmoji('🎉')">🎉</button>
                    <button type="button" class="emoji-btn" onclick="addEmoji('❤️')">❤️</button>
                    <button type="button" class="emoji-btn" onclick="addEmoji('🎁')">🎁</button>
                    <button type="button" class="emoji-btn" onclick="addEmoji('✨')">✨</button>
                    <button type="button" class="emoji-btn" onclick="addEmoji('🐶')">🐶</button>
                </div>

                <button type="submit" class="btn btn-send" onclick="playSubmitSound()">ส่งคำอวยพรให้เพื่อน 💌</button>
            </form>
            <div class="dog-footer">🐩🐾🐕</div>
        </div>

    </div>

    <div class="footer-marquee">
        <div class="marquee-text">✨ 27 มิถุนายน สุขสันต์วันเกิดให้กับ เนติราช • ขอพระเจ้าอวยพระพรในทุกย่างก้าว • สุขสันต์วันเกิด! ✨</div>
    </div>

    <audio id="submitSound">
        <source src="https://www.soundjay.com/misc/sounds/magic-chime-01.mp3" type="audio/mpeg">
    </audio>

    <script>
        // ฟังก์ชันจิ้มอีโมจิแล้วไปโผล่ในช่องข้อความ
        function addEmoji(emoji) {
            const box = document.getElementById('messageBox');
            box.value += emoji;
            box.focus();
        }

        // ฟังก์ชันเปลี่ยนหน้า พร้อมเอฟเฟกต์สดุดี
        function goToTransition() {
            const s1 = document.getElementById('scene1');
            const trans = document.getElementById('transition-scene');
            const s2 = document.getElementById('scene2');

            // เลือนหน้า 1 ออก
            s1.style.opacity = '0';
            setTimeout(() => {
                s1.style.display = 'none';
                trans.style.display = 'flex'; // แสดงหน้าสดุดี 20:4
                
                // หน่วงเวลาหน้าสดุดี 4 วินาทีตามขอ
                setTimeout(() => {
                    trans.style.opacity = '0';
                    trans.style.transition = '1s';
                    
                    setTimeout(() => {
                        trans.style.display = 'none';
                        s2.style.display = 'flex';
                        fireFestiveConfetti(); // ยิงพลุฉลองตอนเข้าหน้ากรอกข้อความ
                    }, 1000);
                }, 4000);

            }, 500);
        }

        // เอฟเฟกต์พลุแบบเยอะๆ (อีโมจิ + พลุ)
        function fireFestiveConfetti() {
            const scalar = 2;
            const dog = confetti.shapeFromText({ text: '🐶', scalar });
            const cake = confetti.shapeFromText({ text: '🎂', scalar });
            const heart = confetti.shapeFromText({ text: '❤️', scalar });

            confetti({
                shapes: [dog, cake, heart],
                particleCount: 50,
                spread: 70,
                origin: { y: 0.6 }
            });
            
            // ยิงพลุสีทองตามไป
            confetti({
                particleCount: 100,
                spread: 160,
                colors: ['#d4af37', '#ffffff', '#2c3e50']
            });
        }

        function playSubmitSound() {
            document.getElementById('submitSound').play();
            // เปิดลิงก์เพลง YouTube ในหน้าต่างใหม่เมื่อส่ง
            setTimeout(() => {
                window.open('https://youtu.be/vhVBWw6rId0?si=MRXeXpyl9ggiL-ZD', '_blank');
            }, 500);
        }
    </script>
</body>
</html>
