<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ปิดการใช้งานระบบชั่วคราว - ศิษย์เก่า รุ่น 74</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --mu-blue: #003366;
            --mu-gold: #F1B434;
            --bg-dark: #0a111a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #050c14 0%, #001f42 100%);
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
        }

        /* 1. แถบบน: นาฬิกาดิจิตอลเรียลไทม์ตัวใหญ่ยักษ์ */
        .top-time-bar {
            width: 100%;
            background: rgba(0, 51, 102, 0.4);
            backdrop-filter: blur(10px);
            border-bottom: 3px solid var(--mu-gold);
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        #digital-clock {
            font-size: 3.5rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.4), 0 0 40px rgba(241, 180, 52, 0.2);
        }

        .time-label {
            font-size: 0.9rem;
            color: var(--mu-gold);
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-top: -5px;
            font-weight: 600;
        }

        /* 2. ตรงกลาง: สัญลักษณ์ตัวใหญ่ๆ พร้อมข้อความแจ้งเตือน */
        .center-status-zone {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            flex: 1;
        }

        /* ลูกเล่นแอนิเมชันพัลส์เรืองแสงที่ตัวสัญลักษณ์ */
        .giant-status-icon {
            font-size: 8rem;
            color: var(--mu-gold);
            margin-bottom: 25px;
            filter: drop-shadow(0 0 15px rgba(241, 180, 52, 0.6));
            animation: iconPulse 2s infinite ease-in-out;
        }

        .status-title {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .status-subtitle {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 300;
        }

        /* 3. แถบล่าง: ข้อความตามสั่ง */
        .bottom-farewell-bar {
            width: 100%;
            background: #04090f;
            border-top: 2px solid rgba(255, 255, 255, 0.1);
            padding: 25px;
            text-align: center;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.4);
        }

        .farewell-text {
            font-size: 1.5rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
            letter-spacing: 1.5px;
        }

        /* Keyframes สำหรับลูกเล่นขยับผ่อนคลายของไอคอน */
        @keyframes iconPulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(241, 180, 52, 0.5)); }
            50% { transform: scale(1.06); filter: drop-shadow(0 0 35px rgba(241, 180, 52, 0.9)); color: #ffffff; }
            100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(241, 180, 52, 0.5)); }
        }

        /* Responsive สำหรับหน้าจอมือถือ */
        @media(max-width: 600px) {
            #digital-clock { font-size: 2.5rem; }
            .giant-status-icon { font-size: 6rem; }
            .status-title { font-size: 1.4rem; }
            .farewell-text { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <div class="top-time-bar">
        <div id="digital-clock">00:00:00</div>
        <div class="time-label">Real-Time Digital Clock</div>
    </div>

    <div class="center-status-zone">
        <div class="giant-status-icon">
            <i class="fas fa-shield-lock"></i>
        </div>
        <h1 class="status-title">ระบบฐานข้อมูลศิษย์เก่า รุ่น 74</h1>
        <p class="status-subtitle">ปิดการใช้งานระบบชั่วคราวเรียบร้อยแล้ว</p>
    </div>

    <div class="bottom-farewell-bar">
        <div class="farewell-text">แล้วพบกันใหม่ @2024</div>
    </div>

    <script>
        function updateRealTimeClock() {
            const clockElement = document.getElementById('digital-clock');
            const now = new Date();
            
            // ดึงเวลา ชั่วโมง:นาที:วินาที และแปลงเป็นเลข 2 หลักเสมอ
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            // แสดงผลลงหน้าเว็บ
            clockElement.textContent = `${hours}:${minutes}:${seconds}`;
        }

        // ตั้งค่าให้ฟังก์ชันทำงานในทุกๆ 1 วินาที (1000 มิลลิวินาที)
        setInterval(updateRealTimeClock, 1000);
        
        // เรียกใช้งานทันทีที่โหลดหน้าเว็บครั้งแรกเพื่อไม่ให้เกิดการหน่วงเวลา
        updateRealTimeClock();
    </script>
</body>
</html>
