<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบร้องขอการโอนเงิน (Money Request)</title>
    <!-- Tailwind CSS สำหรับตกแต่ง UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Library สำหรับเจน PromptPay QR Code -->
    <script src="https://cdn.jsdelivr.net/npm/promptpay-qr@0.5.0/site/promptpay-qr.min.js"></script>
    <!-- Library สำหรับสร้างภาพ QR Code -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl p-6 md:p-8 max-w-md w-full">
        <!-- หน้าจอที่ 1: ฟอร์มสร้างคำขอ -->
        <div id="create-section">
            <h2 class="text-2xl font-bold text-gray-800 mb-4 text-center">💸 สร้างคำขอโอนเงิน</h2>
            <form id="request-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">เบอร์พร้อมเพย์ / เลขบัตรประชาชน</label>
                    <input type="text" id="pp-id" placeholder="08XXXXXXXX" required 
                        class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">จำนวนเงิน (บาท)</label>
                    <input type="number" step="0.01" id="amount" placeholder="0.00" required 
                        class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">หมายเหตุ (ระบุหรือไม่ก็ได้)</label>
                    <input type="text" id="note" placeholder="ค่าอาหาร, ค่าสินค้า" 
                        class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <button type="submit" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition duration-200">
                    สร้างลิงก์ชำระเงิน
                </button>
            </form>
        </div>

        <!-- หน้าจอที่ 2: แสดง QR Code และการชำระเงิน -->
        <div id="payment-section" class="hidden text-center space-y-4">
            <h2 class="text-xl font-bold text-gray-800">รายการร้องขอการโอนเงิน</h2>
            <p id="display-note" class="text-sm text-gray-500 font-medium"></p>
            
            <div class="bg-blue-50 p-4 rounded-xl border border-blue-100">
                <span class="text-sm text-gray-600">ยอดที่ต้องชำระ</span>
                <div class="text-3xl font-extrabold text-blue-600 mt-1">
                    ฿<span id="display-amount">0.00</span>
                </div>
            </div>

            <!-- แสดง QR Code -->
            <div class="flex justify-center my-4">
                <canvas id="qr-canvas" class="border p-2 rounded-lg bg-white shadow-sm"></canvas>
            </div>

            <p class="text-xs text-gray-400">สแกน QR Code ด้วยแอปธนาคารใดก็ได้เพื่อโอนเงิน</p>

            <div class="pt-4 border-t flex gap-2">
                <button id="copy-btn" onclick="copyShareLink()" 
                    class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-medium py-2 rounded-lg transition">
                    📋 คัดลอกลิงก์
                </button>
                <button onclick="resetForm()" 
                    class="flex-1 bg-gray-600 hover:bg-gray-700 text-white text-sm font-medium py-2 rounded-lg transition">
                    ➕ สร้างรายการใหม่
                </button>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('request-form');
        const createSection = document.getElementById('create-section');
        const paymentSection = document.getElementById('payment-section');

        // อ่านข้อมูลจาก URL Parameters (ถ้ามีผู้กดเปิดผ่านลิงก์แชร์)
        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            const target = params.get('target');
            const amount = params.get('amount');
            const note = params.get('note');

            if (target && amount) {
                renderPaymentView(target, amount, note);
            }
        };

        // เมื่อกด Submit ฟอร์มสร้างคำขอ
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const target = document.getElementById('pp-id').value;
            const amount = document.getElementById('amount').value;
            const note = document.getElementById('note').value;

            // อัปเดต URL Param โดยไม่ Reload หน้า
            const newUrl = `${window.location.pathname}?target=${encodeURIComponent(target)}&amount=${encodeURIComponent(amount)}&note=${encodeURIComponent(note)}`;
            window.history.pushState({path: newUrl}, '', newUrl);

            renderPaymentView(target, amount, note);
        });

        // แสดงหน้า QR Code ชำระเงิน
        function renderPaymentView(target, amount, note) {
            createSection.classList.add('hidden');
            paymentSection.classList.remove('hidden');

            document.getElementById('display-amount').textContent = parseFloat(amount).toLocaleString('th-TH', {minimumFractionDigits: 2});
            document.getElementById('display-note').textContent = note ? `(หมายเหตุ: ${note})` : '';

            // สร้าง Payload PromptPay
            const payload = promptpayQr(target, { amount: parseFloat(amount) });

            // วาด QR Code บน Canvas
            QRCode.toCanvas(document.getElementById('qr-canvas'), payload, { width: 220 }, function (error) {
                if (error) console.error(error);
            });
        }

        // คัดลอกลิงก์ส่งให้เพื่อน
        function copyShareLink() {
            navigator.clipboard.writeText(window.location.href);
            const btn = document.getElementById('copy-btn');
            btn.textContent = '✅ คัดลอกเรียบร้อย!';
            setTimeout(() => { btn.textContent = '📋 คัดลอกลิงก์'; }, 2000);
        }

        // กลับไปหน้าสร้างคำขอใหม่
        function resetForm() {
            window.history.pushState({path: window.location.pathname}, '', window.location.pathname);
            paymentSection.classList.add('hidden');
            createSection.classList.remove('hidden');
            form.reset();
        }
    </script>
</body>
</html>
