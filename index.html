<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบลงทะเบียนโปรเจค | IT Project Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .glow-effect:focus {
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.6);
            border-color: rgb(6, 182, 212);
        }
        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.05); opacity: 1; }
        }
        .bg-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(6, 182, 212, 0.15) 0%, transparent 70%);
            top: 20%;
            left: 10%;
            animation: pulse-glow 8s infinite ease-in-out;
            pointer-events: none;
        }
    </style>
</head>
<body class="min-h-screen text-slate-100 flex items-center justify-center p-4 relative overflow-x-hidden">

    <div class="bg-glow"></div>
    <div class="bg-glow" style="right: 10%; top: 60%; background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%);"></div>

    <div class="w-full max-w-2xl glass-card rounded-2xl p-8 transform transition-all duration-500 hover:scale-[1.01] relative z-10">
        
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-cyan-500/10 text-cyan-400 mb-4 border border-cyan-500/30 animate-bounce">
                <i class="fa-solid fa-laptop-code text-2xl"></i>
            </div>
            <h1 class="text-3xl font-bold bg-gradient-to-r from-cyan-400 to-indigo-400 bg-clip-text text-transparent">
                ระบบลงทะเบียนโปรเจค
            </h1>
            <p class="text-slate-400 text-sm mt-2">Information Technology Department</p>
        </div>

        <form id="registrationForm" onsubmit="handleSubmit(event)" class="space-y-6">
            
            <input type="hidden" name="access_key" value="YOUR_ACCESS_KEY_HERE">
            <input type="hidden" name="subject" value="มีการลงทะเบียนโปรเจคใหม่!">

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2"><i class="fa-solid fa-book-bookmark text-cyan-400 mr-2"></i>ชื่อโปรเจค</label>
                <input type="text" name="project_name" required
                    class="w-full bg-slate-900/50 border border-slate-700 rounded-lg px-4 py-3 text-slate-200 placeholder-slate-500 outline-none transition-all glow-effect"
                    placeholder="ระบุชื่อโปรเจคภาษาไทย หรือ English">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2"><i class="fa-solid fa-users text-cyan-400 mr-2"></i>ชื่อกลุ่ม / รายชื่อสมาชิก</label>
                <textarea name="group_name" required rows="2"
                    class="w-full bg-slate-900/50 border border-slate-700 rounded-lg px-4 py-3 text-slate-200 placeholder-slate-500 outline-none transition-all glow-effect"
                    placeholder="เช่น กลุ่ม IT-01 (นาย A, นาย B)"></textarea>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2"><i class="fa-solid fa-graduation-cap text-cyan-400 mr-2"></i>ชั้นปีที่ศึกษา</label>
                <select name="academic_year" required
                    class="w-full bg-slate-900/50 border border-slate-700 rounded-lg px-4 py-3 text-slate-200 outline-none transition-all glow-effect">
                    <option value="" disabled selected class="bg-slate-800">เลือกชั้นปี</option>
                    <option value="ชั้นปีที่ 1" class="bg-slate-800">ชั้นปีที่ 1</option>
                    <option value="ชั้นปีที่ 2" class="bg-slate-800">ชั้นปีที่ 2</option>
                    <option value="ชั้นปีที่ 3" class="bg-slate-800">ชั้นปีที่ 3</option>
                    <option value="ชั้นปีที่ 4" class="bg-slate-800">ชั้นปีที่ 4</option>
                </select>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2"><i class="fa-solid fa-calendar-days text-cyan-400 mr-2"></i>เลือกวันที่</label>
                    <input type="date" id="regDate" name="registration_date" required onchange="checkDateTimeSlot()"
                        class="w-full bg-slate-900/50 border border-slate-700 rounded-lg px-4 py-3 text-slate-200 outline-none transition-all glow-effect">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2"><i class="fa-solid fa-clock text-cyan-400 mr-2"></i>เลือกช่วงเวลา</label>
                    <select id="regTime" name="registration_time" required onchange="checkDateTimeSlot()"
                        class="w-full bg-slate-900/50 border border-slate-700 rounded-lg px-4 py-3 text-slate-200 outline-none transition-all glow-effect">
                        <option value="" disabled selected class="bg-slate-800">เลือกช่วงเวลา</option>
                        <option value="09:00 - 10:30" class="bg-slate-800">09:00 - 10:30 น.</option>
                        <option value="10:30 - 12:00" class="bg-slate-800">10:30 - 12:00 น.</option>
                        <option value="13:00 - 14:30" class="bg-slate-800">13:00 - 14:30 น.</option>
                        <option value="14:30 - 16:00" class="bg-slate-800">14:30 - 16:00 น.</option>
                    </select>
                </div>
            </div>

            <div id="warningMessage" class="hidden text-red-400 text-sm bg-red-500/10 border border-red-500/30 p-3 rounded-lg flex items-center gap-2 transition-all">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <span>ขออภัย วันและเวลานี้มีผู้ลงทะเบียนก่อนหน้าแล้ว กรุณาเลือกเวลาอื่น</span>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2"><i class="fa-solid fa-phone text-cyan-400 mr-2"></i>เบอร์ติดต่อกลับ</label>
                <input type="tel" name="contact_number" required pattern="[0-9]{9,10}"
                    class="w-full bg-slate-900/50 border border-slate-700 rounded-lg px-4 py-3 text-slate-200 placeholder-slate-500 outline-none transition-all glow-effect"
                    placeholder="เช่น 0812345678">
            </div>

            <button type="submit" id="submitBtn"
                class="w-full bg-gradient-to-r from-cyan-500 to-indigo-500 text-white font-medium py-3 px-4 rounded-lg shadow-lg hover:from-cyan-400 hover:to-indigo-400 transition-all duration-300 transform hover:-translate-y-0.5 active:translate-y-0 flex items-center justify-center gap-2">
                <i class="fa-solid fa-paper-plane"></i> ส่งข้อมูลลงทะเบียน
            </button>
        </form>
    </div>

    <div id="successModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-slate-800 border border-slate-700 max-w-md w-full rounded-2xl p-6 text-center shadow-2xl transform scale-95 transition-all">
            <div class="w-16 h-16 bg-emerald-500/10 text-emerald-400 rounded-full flex items-center justify-center mx-auto mb-4 border border-emerald-500/30">
                <i class="fa-solid fa-circle-check text-3xl"></i>
            </div>
            <h3 class="text-xl font-bold text-slate-100 mb-2">ลงทะเบียนสำเร็จ!</h3>
            <p class="text-slate-400 text-sm mb-6">ระบบได้รับข้อมูลของท่านเรียบร้อยแล้ว และกำลังส่งอีเมลยืนยัน</p>
            <button onclick="closeModal()" class="w-full bg-slate-700 hover:bg-slate-600 text-white py-2 rounded-lg transition-colors">
                ตกลง
            </button>
        </div>
    </div>

    <script>
        // ข้อมูลจำลองวันเวลาที่ถูกจองแล้ว (และจะบันทึกเพิ่มลง LocalStorage เมื่อกดส่ง)
        // เพื่อป้องกันไม่ให้วันเวลานี้ซ้ำกัน
        let bookedSlots = JSON.parse(localStorage.getItem('bookedSlots')) || [
            { date: '2026-07-15', time: '09:00 - 10:30' }, // ตัวอย่างข้อมูลที่มีคนจองแล้ว
            { date: '2026-07-15', time: '13:00 - 14:30' }
        ];

        // ฟังก์ชันตรวจสอบการซ้ำของ วัน/เวลา
        function checkDateTimeSlot() {
            const selectedDate = document.getElementById('regDate').value;
            const selectedTime = document.getElementById('regTime').value;
            const warningMessage = document.getElementById('warningMessage');
            const submitBtn = document.getElementById('submitBtn');

            if (!selectedDate || !selectedTime) return;

            // ตรวจสอบใน Array ว่ามีข้อมูลตรงกันไหม
            const isDuplicate = bookedSlots.some(slot => slot.date === selectedDate && slot.time === selectedTime);

            if (isDuplicate) {
                warningMessage.classList.remove('hidden');
                submitBtn.disabled = true;
                submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
            } else {
                warningMessage.classList.add('hidden');
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        // ฟังก์ชันเมื่อกดส่งฟอร์ม
        async function handleSubmit(event) {
            event.preventDefault();
            
            const form = event.target;
            const selectedDate = document.getElementById('regDate').value;
            const selectedTime = document.getElementById('regTime').value;
            const submitBtn = document.getElementById('submitBtn');

            // ล็อคปุ่มป้องกันกดเบิ้ล
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> กำลังส่งข้อมูล...';

            // 1. บันทึกวันเวลาที่เลือกเข้าสู่ระบบป้องกันการซ้ำ (LocalStorage)
            bookedSlots.push({ date: selectedDate, time: selectedTime });
            localStorage.setItem('bookedSlots', JSON.stringify(bookedSlots));

            // 2. ส่งข้อมูลเข้า Email ด้วย Web3Forms API
            const formData = new FormData(form);
            
            try {
                const response = await fetch('https://api.web3forms.com/submit', {
                    method: 'POST',
                    body: formData
                });
                
                if (response.ok) {
                    // แสดง Modal แจ้งเตือนสำเร็จตามโจทย์
                    document.getElementById('successModal').classList.remove('hidden');
                    document.getElementById('successModal').classList.add('flex');
                    form.reset();
                } else {
                    alert('เกิดข้อผิดพลาดในการส่งอีเมล แต่ระบบได้บันทึกคิวของคุณแล้ว');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('ไม่สามารถเชื่อมต่ออินเทอร์เน็ตได้ในขณะนี้');
            } finally {
                // คืนค่าปุ่ม
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> ส่งข้อมูลลงทะเบียน';
            }
        }

        // ฟังก์ชันปิด Modal
        function closeModal() {
            document.getElementById('successModal').classList.add('hidden');
            document.getElementById('successModal').classList.remove('flex');
        }

        // ตั้งค่าขั้นต่ำให้เลือกได้เฉพาะวันปัจจุบันเป็นต้นไป
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('regDate').min = today;
    </script>
</body>
</html>
