<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดตารางเวร Special Nurse / PT</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- html2pdf.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- Google Fonts (Prompt) -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f0f4f8; }
        .bg-medical { background-color: #0056b3; }
        .text-medical { color: #0056b3; }
        .border-medical { border-color: #0056b3; }
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
        }
    </style>
</head>
<body class="text-gray-800">

    <!-- 1. LOGIN SECTION -->
    <div id="loginSection" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border-t-4 border-blue-600">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-3">
                    <i class="fa-solid fa-user-nurse text-3xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-800">ระบบตารางเวรพยาบาล</h1>
                <p class="text-sm text-gray-500">Special Nurse & Part-Time (PT)</p>
            </div>
            
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">รหัสเข้าใช้งาน</label>
                    <input type="password" id="passcode" required placeholder="•••••••" 
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                </div>
                <p id="loginError" class="text-red-500 text-xs hidden">รหัสผ่านไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง</p>
                <button type="submit" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition shadow-md hover:shadow-lg">
                    เข้าสู่ระบบ
                </button>
            </form>
        </div>
    </div>

    <!-- MAIN APP CONTENT (Hidden by default) -->
    <div id="appSection" class="hidden min-h-screen flex flex-col">
        <!-- HEADER -->
        <header class="bg-blue-700 text-white shadow-md no-print">
            <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <i class="fa-solid fa-hospital text-2xl"></i>
                    <span class="font-semibold text-lg">Special Nurse & PT Roster System</span>
                </div>
                <button onclick="logout()" class="text-sm bg-blue-800 hover:bg-blue-900 px-3 py-1.5 rounded-lg transition">
                    <i class="fa-solid fa-right-from-bracket mr-1"></i> ออกจากระบบ
                </button>
            </div>
        </header>

        <div class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full space-y-6">

            <!-- 2. HOSPITAL & DEPARTMENT SELECTION -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 no-print">
                <h2 class="text-lg font-bold text-gray-800 mb-4 flex items-center">
                    <i class="fa-solid fa-clinic-medical text-blue-600 mr-2"></i> เลือกโรงพยาบาลและแผนก
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">โรงพยาบาล</label>
                        <select id="hospitalSelect" onchange="updateDepartments()" class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                            <option value="">-- กรุณาเลือกโรงพยาบาล --</option>
                            <option value="โรงพยาบาลพญาไท">โรงพยาบาลพญาไท</option>
                            <option value="โรงพยาบาลบำรุงราษฎร์ อินเตอร์เนชั่นแนล">โรงพยาบาลบำรุงราษฎร์ อินเตอร์เนชั่นแนล</option>
                            <option value="โรงพยาบาลกรุงเทพคริสเตียน">โรงพยาบาลกรุงเทพคริสเตียน</option>
                            <option value="โรงพยาบาลกรุงเทพศูนย์การแพทย์">โรงพยาบาลกรุงเทพศูนย์การแพทย์</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">แผนก / หน่วยงาน</label>
                        <select id="departmentSelect" onchange="onDepartmentChange()" class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" disabled>
                            <option value="">-- เลือกแผนก --</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- 3. ROSTER CONTROL PANEL (Hidden until department selected) -->
            <div id="rosterControls" class="hidden space-y-6">
                <!-- ADD SHIFT FORM -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 no-print">
                    <h3 class="text-md font-bold text-gray-800 mb-4 flex items-center">
                        <i class="fa-solid fa-calendar-plus text-blue-600 mr-2"></i> เพิ่ม/บันทึก การเข้าเวร
                    </h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-3">
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">เดือน / ปี</label>
                            <input type="month" id="monthPicker" onchange="renderCalendar()" class="w-full p-2 border rounded-lg text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">วันที่</label>
                            <input type="number" id="shiftDay" min="1" max="31" placeholder="เช่น 15" class="w-full p-2 border rounded-lg text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">ช่วงเวลา (เวร)</label>
                            <select id="shiftType" class="w-full p-2 border rounded-lg text-sm">
                                <option value="เช้า (07:00-15:00)">เช้า (07:00-15:00)</option>
                                <option value="บ่าย (15:00-23:00)">บ่าย (15:00-23:00)</option>
                                <option value="ดึก (23:00-07:00)">ดึก (23:00-07:00)</option>
                                <option value="OT (Special)">OT (Special)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">ชื่อ-สกุล ผู้เข้าเวร</label>
                            <input type="text" id="nurseName" placeholder="พว. สมศรี มีสุข" class="w-full p-2 border rounded-lg text-sm">
                        </div>
                        <div class="flex items-end">
                            <button onclick="addShift()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white p-2 rounded-lg text-sm font-medium transition shadow">
                                <i class="fa-solid fa-plus mr-1"></i> เพิ่มลงตาราง
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 4. CALENDAR VIEW CONTAINER (Export Target) -->
                <div id="exportArea" class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                    <!-- CALENDAR HEADER FOR PRINT -->
                    <div class="border-b pb-4 mb-4 flex justify-between items-start">
                        <div>
                            <h2 id="pdfHospitalName" class="text-xl font-bold text-blue-900">โรงพยาบาล...</h2>
                            <p id="pdfDepartmentName" class="text-md text-gray-600 font-medium">แผนก: ...</p>
                        </div>
                        <div class="text-right">
                            <span class="inline-block px-3 py-1 bg-blue-100 text-blue-800 rounded-full text-xs font-semibold mb-1">Special Nurse & PT</span>
                            <h3 id="calendarMonthTitle" class="text-lg font-semibold text-gray-700">ประจำเดือน: -</h3>
                        </div>
                    </div>

                    <!-- CALENDAR GRID -->
                    <div class="grid grid-cols-7 gap-px bg-gray-200 border border-gray-200 rounded-lg overflow-hidden text-sm">
                        <!-- Days of Week Header -->
                        <div class="bg-blue-600 text-white font-semibold p-2 text-center">อา.</div>
                        <div class="bg-blue-600 text-white font-semibold p-2 text-center">จ.</div>
                        <div class="bg-blue-600 text-white font-semibold p-2 text-center">อ.</div>
                        <div class="bg-blue-600 text-white font-semibold p-2 text-center">พ.</div>
                        <div class="bg-blue-600 text-white font-semibold p-2 text-center">พฤ.</div>
                        <div class="bg-blue-600 text-white font-semibold p-2 text-center">ศ.</div>
                        <div class="bg-blue-600 text-white font-semibold p-2 text-center">ส.</div>

                        <!-- Days cells generated dynamically -->
                        <div id="calendarDays" class="contents"></div>
                    </div>
                </div>

                <!-- ACTION BUTTONS -->
                <div class="flex justify-end space-x-3 no-print">
                    <button onclick="clearCurrentSchedule()" class="px-4 py-2 bg-red-100 text-red-600 hover:bg-red-200 rounded-lg text-sm font-medium transition">
                        <i class="fa-solid fa-trash-can mr-1"></i> ล้างข้อมูลตารางนี้
                    </button>
                    <button onclick="exportToPDF()" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium transition shadow-md">
                        <i class="fa-solid fa-file-pdf mr-1"></i> ส่งออกเป็น PDF
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // CONFIG & DATA STRUCTURES
        const AUTH_CODE = "6770649";
        
        const hospitalData = {
            "โรงพยาบาลพญาไท": ["เช็คอัพ B8 ตรวจตา"],
            "โรงพยาบาลบำรุงราษฎร์ อินเตอร์เนชั่นแนล": ["Special Nurse PT"],
            "โรงพยาบาลกรุงเทพคริสเตียน": ["แผนกฉุกเฉิน ER", "แผนกวิกฤตหัวใจ CCU"],
            "โรงพยาบาลกรุงเทพศูนย์การแพทย์": ["แผนกหัวใจ"]
        };

        // Key-value store for schedule data: key = "Hospital-Department-YYYY-MM"
        let schedules = {};

        // INITIALIZATION
        window.onload = function() {
            // Set default month to current YYYY-MM
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            document.getElementById('monthPicker').value = `${year}-${month}`;
        };

        // LOGIN SYSTEM
        function handleLogin(e) {
            e.preventDefault();
            const inputCode = document.getElementById('passcode').value;
            const errorMsg = document.getElementById('loginError');

            if (inputCode === AUTH_CODE) {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('appSection').classList.remove('hidden');
                document.getElementById('passcode').value = '';
                errorMsg.classList.add('hidden');
            } else {
                errorMsg.classList.remove('hidden');
            }
        }

        function logout() {
            document.getElementById('appSection').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('rosterControls').classList.add('hidden');
            document.getElementById('hospitalSelect').value = '';
            document.getElementById('departmentSelect').value = '';
            document.getElementById('departmentSelect').disabled = true;
        }

        // DEPARTMENT DROPDOWN LOGIC
        function updateDepartments() {
            const hospSelect = document.getElementById('hospitalSelect');
            const deptSelect = document.getElementById('departmentSelect');
            const selectedHosp = hospSelect.value;

            deptSelect.innerHTML = '<option value="">-- เลือกแผนก --</option>';

            if (selectedHosp && hospitalData[selectedHosp]) {
                hospitalData[selectedHosp].forEach(dept => {
                    const opt = document.createElement('option');
                    opt.value = dept;
                    opt.textContent = dept;
                    deptSelect.appendChild(opt);
                });
                deptSelect.disabled = false;
            } else {
                deptSelect.disabled = true;
            }

            document.getElementById('rosterControls').classList.add('hidden');
        }

        function onDepartmentChange() {
            const dept = document.getElementById('departmentSelect').value;
            const controls = document.getElementById('rosterControls');
            
            if (dept) {
                controls.classList.remove('hidden');
                renderCalendar();
            } else {
                controls.classList.add('hidden');
            }
        }

        // GET SCHEDULE KEY
        function getScheduleKey() {
            const hosp = document.getElementById('hospitalSelect').value;
            const dept = document.getElementById('departmentSelect').value;
            const month = document.getElementById('monthPicker').value;
            return `${hosp}_${dept}_${month}`;
        }

        // CALENDAR GENERATION LOGIC
        function renderCalendar() {
            const hosp = document.getElementById('hospitalSelect').value;
            const dept = document.getElementById('departmentSelect').value;
            const monthVal = document.getElementById('monthPicker').value;

            if (!hosp || !dept || !monthVal) return;

            // Update Titles
            document.getElementById('pdfHospitalName').textContent = hosp;
            document.getElementById('pdfDepartmentName').textContent = `แผนก: ${dept}`;
            
            const [year, month] = monthVal.split('-').map(Number);
            const monthNames = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
            document.getElementById('calendarMonthTitle').textContent = `ประจำเดือน: ${monthNames[month - 1]} ${year + 543}`;

            // Calculate days
            const firstDayIndex = new Date(year, month - 1, 1).getDay();
            const daysInMonth = new Date(year, month, 0).getDate();

            const calendarContainer = document.getElementById('calendarDays');
            calendarContainer.innerHTML = '';

            const key = getScheduleKey();
            const monthData = schedules[key] || {};

            // Empty cells before start of month
            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = "bg-gray-50 min-h-[90px] p-1 border-b border-r border-gray-200";
                calendarContainer.appendChild(emptyCell);
            }

            // Fill actual month days
            for (let day = 1; day <= daysInMonth; day++) {
                const dayCell = document.createElement('div');
                dayCell.className = "bg-white min-h-[90px] p-1.5 border-b border-r border-gray-200 flex flex-col justify-start";
                
                let dayHeader = `<div class="font-bold text-gray-700 text-xs mb-1">${day}</div>`;
                let shiftsHtml = '';

                if (monthData[day]) {
                    monthData[day].forEach((item, index) => {
                        let colorClass = "bg-blue-50 text-blue-700 border-blue-200";
                        if(item.type.includes("เช้า")) colorClass = "bg-emerald-50 text-emerald-700 border-emerald-200";
                        if(item.type.includes("บ่าย")) colorClass = "bg-amber-50 text-amber-700 border-amber-200";
                        if(item.type.includes("ดึก")) colorClass = "bg-purple-50 text-purple-700 border-purple-200";

                        shiftsHtml += `
                            <div class="text-[10px] p-1 mb-1 rounded border ${colorClass} leading-tight flex justify-between items-center group">
                                <div>
                                    <span class="font-semibold block">${item.type}</span>
                                    <span>${item.name}</span>
                                </div>
                                <button onclick="deleteShift(${day}, ${index})" class="no-print text-red-400 hover:text-red-600 ml-1">
                                    <i class="fa-solid fa-xmark"></i>
                                </button>
                            </div>
                        `;
                    });
                }

                dayCell.innerHTML = dayHeader + shiftsHtml;
                calendarContainer.appendChild(dayCell);
            }
        }

        // ADD SHIFT TO DATA
        function addShift() {
            const day = parseInt(document.getElementById('shiftDay').value);
            const type = document.getElementById('shiftType').value;
            const name = document.getElementById('nurseName').value.trim();
            const monthVal = document.getElementById('monthPicker').value;
            
            if (!day || !name) {
                alert("กรุณากรอกวันที่และชื่อผู้เข้าเวรให้ครบถ้วน");
                return;
            }

            const [year, month] = monthVal.split('-').map(Number);
            const daysInMonth = new Date(year, month, 0).getDate();

            if (day < 1 || day > daysInMonth) {
                alert(`วันที่ไม่ถูกต้อง (เดือนนี้มี ${daysInMonth} วัน)`);
                return;
            }

            const key = getScheduleKey();
            if (!schedules[key]) schedules[key] = {};
            if (!schedules[key][day]) schedules[key][day] = [];

            schedules[key][day].push({ type, name });

            // Reset Input
            document.getElementById('shiftDay').value = '';
            document.getElementById('nurseName').value = '';

            renderCalendar();
        }

        // DELETE SINGLE SHIFT
        function deleteShift(day, index) {
            const key = getScheduleKey();
            if (schedules[key] && schedules[key][day]) {
                schedules[key][day].splice(index, 1);
                renderCalendar();
            }
        }

        // CLEAR ALL SCHEDULE
        function clearCurrentSchedule() {
            if (confirm("คุณแน่ใจหรือไม่ว่าต้องการล้างตารางเวรทั้งหมดของเดือนนี้?")) {
                const key = getScheduleKey();
                delete schedules[key];
                renderCalendar();
            }
        }

        // EXPORT TO PDF
        function exportToPDF() {
            const element = document.getElementById('exportArea');
            const hosp = document.getElementById('hospitalSelect').value;
            const dept = document.getElementById('departmentSelect').value;
            const month = document.getElementById('monthPicker').value;

            const opt = {
                margin:       [0.3, 0.3, 0.3, 0.3],
                filename:     `ตารางเวร_${hosp}_${dept}_${month}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'in', format: 'a4', orientation: 'landscape' }
            };

            html2pdf().set(opt).from(element).save();
        }
    </script>
</body>
</html>
