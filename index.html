<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสร้างคิวอาร์โค้ดชำระเงิน - Enterprise Payment Gateway</title>
    <!-- QR Code Generator Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #f8fafc;
            --card-surface: #ffffff;
            --primary-navy: #0f172a;
            --accent-blue: #1d4ed8;
            --border-subtle: #cbd5e1;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --success: #15803d;
            --overlay-bg: rgba(15, 23, 42, 0.6);
        }

        body {
            font-family: 'Sarabun', 'Inter', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* แถบด้านบนระดับสากล (Top Navigation Bar) */
        .top-navbar {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            box-sizing: border-box;
        }

        .brand-logo {
            display: flex;
            flex-direction: column;
        }

        .brand-logo h1 {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary-navy);
            margin: 0;
            letter-spacing: -0.5px;
        }

        .brand-logo p {
            font-size: 11px;
            color: var(--text-secondary);
            margin: 2px 0 0 0;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .btn-admin-nav {
            background: transparent;
            border: 1px solid var(--border-subtle);
            padding: 8px 18px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-admin-nav:hover {
            border-color: var(--primary-navy);
            background-color: rgba(15, 23, 42, 0.04);
        }

        /* พื้นที่แสดงผลส่วนกลาง */
        .main-content {
            width: 100%;
            max-width: 1120px;
            padding: 0 40px;
            box-sizing: border-box;
            margin-top: 40px;
        }

        .gateway-container {
            background: var(--card-surface);
            border-radius: 12px;
            padding: 40px;
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 1px 3px 0 rgba(0,0,0,0.05), 0 4px 15px -3px rgba(0,0,0,0.03);
        }

        /* จัดแถวหน้ากระดานแบบทางการ (Row Matrix Layout) */
        .form-grid-row {
            display: grid;
            grid-template-columns: 1.2fr 1fr 1fr 1fr; /* แบ่ง 4 ส่วนเท่ากันสำหรับปุ่มกดด้วย */
            gap: 16px;
            align-items: flex-end; /* ให้ปุ่มเสมอกับช่องกรอก */
        }

        @media (max-width: 992px) {
            .form-grid-row {
                grid-template-columns: 1fr; /* ยุบลงมาถ้ารันบนจอเล็ก */
            }
        }

        .input-wrapper {
            display: flex;
            flex-direction: column;
        }

        .input-wrapper label {
            font-size: 13px;
            font-weight: 600;
            color: var(--primary-navy);
            margin-bottom: 8px;
        }

        select, input {
            width: 100%;
            padding: 12px 14px;
            background: #ffffff;
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            color: var(--text-primary);
            font-family: 'Sarabun', sans-serif;
            transition: all 0.15s ease;
        }

        select:focus, input:focus {
            border-color: var(--accent-blue);
            outline: none;
            box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.1);
        }

        .btn-action {
            width: 100%;
            padding: 13px;
            background: var(--primary-navy);
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s;
            font-family: 'Sarabun', sans-serif;
        }

        .btn-action:hover {
            background: #1e293b;
        }

        /* พรีเมียม อนิเมชัน โหลด 1-100% */
        .premium-loader {
            display: none;
            text-align: center;
            padding: 50px 0;
        }

        .spinner-box {
            position: relative;
            width: 60px;
            height: 60px;
            margin: 0 auto 20px auto;
            border: 3px solid rgba(15, 23, 42, 0.05);
            border-top: 3px solid var(--accent-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loader-counter {
            font-family: 'Inter', sans-serif;
            font-size: 24px;
            font-weight: 600;
            color: var(--primary-navy);
            margin-bottom: 6px;
        }

        .loader-subtitle {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* บล็อกแสดงคิวอาร์โค้ด */
        #qr-output-zone {
            display: none;
            text-align: center;
            padding: 30px 0 10px 0;
            animation: fadeIn 0.4s ease-out;
        }

        #qrcode {
            display: inline-block;
            padding: 16px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .status-badge {
            display: inline-block;
            background: #f0fdf4;
            color: #166534;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 25px;
            border: 1px solid #bbf7d0;
        }

        /* หน้าต่างความปลอดภัยของแอดมิน (Admin Modal Window) */
        .admin-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--overlay-bg);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--card-surface);
            width: 100%;
            max-width: 800px;
            border-radius: 12px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            overflow: hidden;
            animation: modalSlide 0.3s ease-out;
        }

        .modal-header {
            padding: 20px 30px;
            background: #f8fafc;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            margin: 0;
            font-size: 16px;
            color: var(--primary-navy);
        }

        .btn-close-modal {
            background: transparent;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-secondary);
        }

        .modal-body {
            padding: 30px;
            max-height: 455px;
            overflow-y: auto;
        }

        /* ตารางสไตล์งานราชการและธนาคาร (Corporate Table) */
        .corporate-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 13.5px;
        }

        .corporate-table th {
            background: #f1f5f9;
            color: var(--primary-navy);
            padding: 12px 16px;
            font-weight: 600;
            border-bottom: 2px solid var(--border-subtle);
        }

        .corporate-table td {
            padding: 14px 16px;
            border-bottom: 1px solid #edf2f7;
            color: #334155;
        }

        /* Keyframes */
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes modalSlide { from { transform: translateY(-30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>

<!-- แถบด้านบนเมนูแอดมิน -->
<div class="top-navbar">
    <div class="brand-logo">
        <h1>ระบบสร้างคิวอาร์โค้ดชำระเงิน</h1>
        <p>INTEGRATED OFFICIAL QR GATEWAY</p>
    </div>
    <button type="button" class="btn-admin-nav" onclick="requestAdminAuth()">
        🔒 ระบบแอดมิน (ผู้ดูแลระบบ)
    </button>
</div>

<div class="main-content">
    <div class="gateway-container">
        
        <!-- ฟอร์มเรียงแถวหน้ากระดานระดับพรีเมียม -->
        <form id="gatewayForm" onsubmit="executePaymentPipeline(event)">
            <div class="form-grid-row">
                <!-- ช่องเลือกธนาคาร -->
                <div class="input-wrapper">
                    <label for="bank">ธนาคารผู้โอน</label>
                    <select id="bank" required>
                        <option value="">-- เลือกสถาบันการเงิน --</option>
                        <option value="ธ.กสิกรไทย (KBank)">ธนาคารกสิกรไทย (KBank)</option>
                        <option value="ธ.ไทยพาณิชย์ (SCB)">ธนาคารไทยพาณิชย์ (SCB)</option>
                        <option value="ธ.กรุงเทพ (BBL)">ธนาคารกรุงเทพ (BBL)</option>
                        <option value="ธ.กรุงไทย (KTB)">ธนาคารกรุงไทย (KTB)</option>
                        <option value="ธ.ทหารไทยธนชาต (ttb)">ธนาคารทหารไทยธนชาต (ttb)</option>
                        <option value="ธ.ออมสิน (GSB)">ธนาคารออมสิน (GSB)</option>
                    </select>
                </div>

                <!-- ช่องกรอกจำนวนเงิน -->
                <div class="input-wrapper">
                    <label for="amount">จำนวนเงินสุทธิ (บาท)</label>
                    <input type="number" id="amount" step="0.01" min="1" placeholder="0.00" required>
                </div>

                <!-- ช่องกรอกเบอร์โทรศัพท์ -->
                <div class="input-wrapper">
                    <label for="phone">เบอร์โทรศัพท์เคลื่อนที่</label>
                    <input type="tel" id="phone" pattern="[0-9]{10}" placeholder="089XXXXXXX" required>
                </div>

                <!-- ปุ่มส่งข้อมูลในแถวเดียวกัน -->
                <button type="submit" class="btn-action">สร้างใบแจ้งชำระเงิน (QR)</button>
            </div>
        </form>

        <!-- เอฟเฟคการหมุนโหลดสไตล์พรีเมียมธนาคาร -->
        <div id="premiumLoader" class="premium-loader">
            <div class="spinner-box"></div>
            <div id="loaderCounter" class="loader-counter">0%</div>
            <div class="loader-subtitle">กำลังจัดเตรียมโครงสร้างช่องทางชำระเงินที่ปลอดภัย...</div>
        </div>

        <!-- หน้าต่างแสดงผลลัพธ์ QR Code -->
        <div id="qr-output-zone">
            <div id="qrcode"></div>
            <div>
                <span class="status-badge">ระบบดึงข้อมูลข้อมูลความปลอดภัยเรียบร้อยแล้ว</span>
            </div>
            <button type="button" class="btn-action" style="background: var(--success); max-width: 280px;" onclick="returnToHomepage()">เสร็จสิ้นรายการ</button>
        </div>

    </div>
</div>

<!-- หน้าต่างระบบตรวจสอบข้อมูลของแอดมิน (Admin Modal Window) -->
<div id="adminModal" class="admin-modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>📊 รายการจัดเก็บข้อมูลผู้เข้าทำรายการหลังบ้าน (แอดมิน)</h3>
            <button type="button" class="btn-close-modal" onclick="closeAdminPanel()">&times;</button>
        </div>
        <div class="modal-body">
            <table class="corporate-table">
                <thead>
                    <tr>
                        <th>วัน-เวลาที่บันทึก</th>
                        <th>สถาบันการเงิน</th>
                        <th>จำนวนเงิน (บาท)</th>
                        <th>เบอร์โทรศัพท์ผู้โอน</th>
                    </tr>
                </thead>
                <tbody id="databaseTableBody">
                    <!-- ข้อมูลถูกจำลองบันทึกไว้จะแสดงตรงนี้ -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const promptpayNumber = "0635164271";

    // ออนโหลดเพื่อเคลียร์หรือสร้างฐานข้อมูลระบบจำลอง
    if (!localStorage.getItem('admin_db_store')) {
        localStorage.setItem('admin_db_store', JSON.stringify([]));
    }

    // ฟังก์ชันจัดการท่อข้อมูลประมวลผลและการนับเลข 1-100%
    function executePaymentPipeline(e) {
        e.preventDefault();

        document.getElementById('gatewayForm').style.display = 'none';
        document.getElementById('premiumLoader').style.display = 'block';

        let counterText = document.getElementById('loaderCounter');
        let currentCount = 0;
        let limit = 100;

        let trackingInterval = setInterval(() => {
            currentCount++;
            counterText.textContent = currentCount + '%';

            if(currentCount >= limit) {
                clearInterval(trackingInterval);
                commitDataAndBuildQR();
            }
        }, 15); // ความเร็วประมวลผลนิ่งๆ แบบมืออาชีพ
    }

    // บันทึกข้อมูลลง DB ลับแอดมินและรันคิวอาร์โค้ด
    function commitDataAndBuildQR() {
        document.getElementById('premiumLoader').style.display = 'none';
        document.getElementById('qr-output-zone').style.display = 'block';

        const bank = document.getElementById('bank').value;
        const amount = parseFloat(document.getElementById('amount').value).toFixed(2);
        const phone = document.getElementById('phone').value;
        const currentTimestamp = new Date().toLocaleString('th-TH');

        // ทำบันทึกส่งเข้าอาเรย์ Database หลังบ้านทันทีที่ประมวลผลสำเร็จ
        let dbStore = JSON.parse(localStorage.getItem('admin_db_store')) || [];
        dbStore.unshift({ currentTimestamp, bank, amount, phone });
        localStorage.setItem('admin_db_store', JSON.stringify(dbStore));

        document.getElementById('qrcode').innerHTML = "";
        const qrRawPayload = generatePromptPayPayload(promptpayNumber, amount);

        new QRCode(document.getElementById("qrcode"), {
            text: qrRawPayload,
            width: 190,
            height: 190,
            colorDark : "#0f172a",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.M
        });
    }

    // สั่งเด้งกลับหน้าโฮมเพจหลักทันทีเมื่อกดเสร็จสิ้น
    function returnToHomepage() {
        location.reload(); 
    }

    // ฟังก์ชันความปลอดภัยเรียกดูแผงแอดมิน
    function requestAdminAuth() {
        const accessKey = prompt("🔐 SECURITY CHECK: กรุณากรอกรหัสผ่านผู้ดูแลระบบ (Admin Access Key):");
        if (accessKey === "1323") {
            openAdminPanel();
        } else if (accessKey !== null) {
            alert("❌ ปฏิเสธการเข้าถึง: รหัสผ่านยืนยันตัวตนไม่ถูกต้อง");
        }
    }

    function openAdminPanel() {
        const tableBody = document.getElementById('databaseTableBody');
        let dbStore = JSON.parse(localStorage.getItem('admin_db_store')) || [];

        if (dbStore.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:var(--text-secondary);">ไม่พบฐานข้อมูลผู้ทำธุรกรรมในระบบขณะนี้</td></tr>`;
        } else {
            tableBody.innerHTML = dbStore.map(data => `
                <tr>
                    <td style="font-family:'Inter'; font-weight:500;">${data.currentTimestamp}</td>
                    <td><b>${data.bank}</b></td>
                    <td style="color:var(--accent-blue); font-weight:600; font-family:'Inter';">${data.amount}</td>
                    <td style="font-family:'Inter';">${data.phone}</td>
                </tr>
            `).join('');
        }

        document.getElementById('adminModal').style.display = 'flex';
    }

    function closeAdminPanel() {
        document.getElementById('adminModal').style.display = 'none';
    }

    // ฟังก์ชันถอดสูตรคำนวณพร้อมเพย์มาตรฐานระดับสากล EMVCo
    function generatePromptPayPayload(target, amount) {
        target = target.replace(/[- ]/g, "");
        if (target.length === 10 && target.startsWith("0")) {
            target = "66" + target.substring(1);
        }
        target = target.padStart(13, '0');

        let payload = "00020101021129370016A0000006770101110113" + target;
        payload += "5303764"; 
        
        if (amount) {
            let amtStr = amount.toString();
            payload += "54" + amtStr.length.toString().padStart(2, '0') + amtStr;
        }
        payload += "6304";
        let crc = crc16(payload);
        return payload + crc.toUpperCase();
    }

    function crc16(str) {
        let crc = 0xFFFF;
        for (let c = 0; c < str.length; c++) {
            let b = str.charCodeAt(c);
            for (let i = 0; i < 8; i++) {
                let bit = ((b >> (7 - i) & 1) == 1);
                let c15 = ((crc >> 15 & 1) == 1);
                crc <<= 1;
                if (c15 ^ bit) crc ^= 0x1021;
            }
        }
        crc &= 0xFFFF;
        return crc.toString(16).padStart(4, '0');
    }
</script>

</body>
</html>
