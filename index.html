<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสร้างคิวอาร์โค้ดชำระเงิน - Official Gateway</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --primary-color: #0f172a;
            --border-color: #e2e8f0;
            --text-main: #334155;
            --text-muted: #94a3b8;
            --accent-blue: #2563eb;
            --success: #16a34a;
        }

        body {
            font-family: 'Sarabun', 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
        }

        .system-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .system-title h2 {
            font-size: 22px;
            font-weight: 600;
            color: var(--primary-color);
            margin: 0 0 6px 0;
            letter-spacing: -0.5px;
        }

        .system-title p {
            color: var(--text-muted);
            font-size: 12px;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* การจัดวางหน้าต่างหลัก */
        .gateway-card {
            width: 100%;
            max-width: 900px; /* ขยายความกว้างเพื่อรองรับแถวหน้ากระดาน */
            background: var(--card-bg);
            border-radius: 16px;
            padding: 40px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        }

        /* จัดเรียง input เป็นหน้ากระดาน (Row Layout) */
        .form-row {
            display: grid;
            grid-template-columns: 1.2fr 1fr 1fr; /* แบ่ง 3 คอลัมน์ตามความเหมาะสม */
            gap: 20px;
            margin-bottom: 25px;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr; /* จอมือถือจะปรับกลับเป็นแนวตั้งอัตโนมัติ */
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--primary-color);
            font-size: 14px;
        }

        select, input {
            width: 100%;
            padding: 12px 16px;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            color: var(--primary-color);
            font-family: 'Sarabun', sans-serif;
            transition: all 0.2s ease;
        }

        select:focus, input:focus {
            border-color: var(--accent-blue);
            outline: none;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        /* ปุ่มกดสไตล์ทางการ */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            font-family: 'Sarabun', sans-serif;
        }

        .btn-submit:hover {
            background: #1e293b;
        }

        /* ระบบโหลดระดับพรีเมียม (Premium Linear Loader) */
        .loader-container {
            display: none;
            text-align: center;
            padding: 40px 0;
            max-width: 400px;
            margin: 0 auto;
        }

        .loader-bar-bg {
            width: 100%;
            height: 4px;
            background: #f1f5f9;
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 15px;
            position: relative;
        }

        .loader-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--accent-blue);
            transition: width 0.03s linear;
        }

        .loader-status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--text-muted);
        }

        .progress-number {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            color: var(--primary-color);
        }

        /* ส่วนแสดงผล QR Code */
        #qr-section {
            display: none;
            text-align: center;
            padding: 20px 0 0 0;
            animation: fadeIn 0.4s ease;
        }

        #qrcode {
            display: inline-block;
            padding: 16px;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .qr-info {
            font-size: 14px;
            color: var(--text-main);
            margin-bottom: 25px;
        }

        /* โซนแอดมินแบบคลีนๆ */
        .admin-zone {
            margin-top: 30px;
            text-align: center;
        }

        .btn-admin {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 12px;
            text-decoration: underline;
            transition: color 0.2s;
        }

        .btn-admin:hover {
            color: var(--primary-color);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="system-title">
    <h2>ระบบสร้างคิวอาร์โค้ดชำระเงิน</h2>
    <p>SECURE PAYMENT GATEWAY PORTAL</p>
</div>

<div class="gateway-card">
    <form id="paymentForm" onsubmit="startPremiumProcessing(event)">
        <div class="form-row">
            <div class="form-group">
                <label for="bank">ธนาคารผู้โอน</label>
                <select id="bank" required>
                    <option value="">-- เลือกธนาคาร --</option>
                    <option value="KBank">ธนาคารกสิกรไทย (KBank)</option>
                    <option value="SCB">ธนาคารไทยพาณิชย์ (SCB)</option>
                    <option value="BBL">ธนาคารกรุงเทพ (BBL)</option>
                    <option value="KTB">ธนาคารกรุงไทย (KTB)</option>
                    <option value="TTB">ธนาคารทหารไทยธนชาต (ttb)</option>
                    <option value="GSB">ธนาคารออมสิน (GSB)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="amount">จำนวนเงิน (บาท)</label>
                <input type="number" id="amount" step="0.01" min="1" placeholder="0.00" required>
            </div>

            <div class="form-group">
                <label for="phone">เบอร์โทรศัพท์มือถือ</label>
                <input type="tel" id="phone" pattern="[0-9]{10}" placeholder="089XXXXXXX" required>
            </div>
        </div>

        <button type="submit" class="btn-submit">ตรวจสอบและสร้างคิวอาร์โค้ด</button>
    </form>

    <div id="loaderContainer" class="loader-container">
        <div class="loader-bar-bg">
            <div id="loaderBarFill" class="loader-bar-fill"></div>
        </div>
        <div class="loader-status">
            <span>กำลังเข้ารหัสการเชื่อมต่อปลอดภัย...</span>
            <span id="progressNumber" class="progress-number">0%</span>
        </div>
    </div>

    <div id="qr-section">
        <div id="qrcode"></div>
        
        <div class="qr-info">
            <strong>THAI QR PAYMENT</strong><br>
            <span style="color: var(--text-muted); font-size: 13px;">กรุณาสแกนตรวจสอบยอดเงินให้ตรงตามที่ระบุ</span>
        </div>
        
        <button type="button" class="btn-submit" style="background: var(--success); max-width: 250px;" onclick="resetToMainPage()">เสร็จสิ้นรายการ</button>
    </div>
</div>

<div class="admin-zone">
    <button type="button" class="btn-admin" onclick="checkAdminAccess()">เข้าสู่ระบบแอดมิน</button>
</div>

<script>
    const promptpayNumber = "0635164271";

    // ฟังก์ชันโหลดเอฟเฟค 1-100% แบบผู้ใหญ่/ทางการ
    function startPremiumProcessing(e) {
        e.preventDefault();

        // ซ่อนหน้าฟอร์มหลัก
        document.getElementById('paymentForm').style.display = 'none';
        document.getElementById('loaderContainer').style.display = 'block';

        let barFill = document.getElementById('loaderBarFill');
        let numText = document.getElementById('progressNumber');
        
        let currentPercent = 0;
        let targetPercent = 100;

        let interval = setInterval(() => {
            currentPercent++;
            barFill.style.width = currentPercent + '%';
            numText.textContent = currentPercent + '%';

            if (currentPercent >= targetPercent) {
                clearInterval(interval);
                generateAndShowQR();
            }
        }, 20); // ควบคุมความเร็วในการโหลด
    }

    // ฟังก์ชันสร้างและแสดงผล QR Code
    function generateAndShowQR() {
        document.getElementById('loaderContainer').style.display = 'none';
        document.getElementById('qr-section').style.display = 'block';

        const amount = parseFloat(document.getElementById('amount').value).toFixed(2);
        document.getElementById('qrcode').innerHTML = "";

        const qrText = generatePromptPayPayload(promptpayNumber, amount);

        new QRCode(document.getElementById("qrcode"), {
            text: qrText,
            width: 180,
            height: 180,
            colorDark : "#0f172a",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.M
        });
    }

    // ฟังก์ชันเคลียร์ค่าเด้งกลับหน้าหลัก
    function resetToMainPage() {
        alert("บันทึกข้อมูลธุรกรรมเข้าสู่ระบบเรียบร้อยแล้ว");
        location.reload(); // โหลดหน้าใหม่เพื่อกลับสู่หน้าหลักที่สะอาด
    }

    // ฟังก์ชันสำหรับเข้าสู่ระบบแอดมิน (ตรวจสอบรหัสผ่านอย่างเดียว)
    function checkAdminAccess() {
        const password = prompt("กรุณากรอกรหัสผ่านผู้ดูแลระบบ (Admin Password):");
        if (password === "1323") {
            alert("🔓 ยืนยันตัวตนสำเร็จ: เข้าสู่ระบบฐานข้อมูลแอดมินเรียบร้อยแล้ว");
        } else if (password !== null) {
            alert("❌ รหัสผ่านไม่ถูกต้อง ไม่สามารถเข้าถึงระบบได้");
        }
    }

    // ฟังก์ชันถอดรหัสและคำนวณพร้อมเพย์ (มาตรฐาน EMVCo)
    function generatePromptPayPayload(target, amount) {
        target = target.replace(/[- ]/g, "");
        if (target.length === 10 && target.startsWith("0")) {
            target = "66" + target.substring(1);
        }
        target = target.padStart(13, '0');

        let payload = "00020101021129370016A0000006770101110113" + target;
        payload += "5303764"; 
        
        if (amount) {
            let amtStr = amount.toString();
            payload += "54" + amtStr.length.toString().padStart(2, '0') + amtStr;
        }
        payload += "6304";
        let crc = crc16(payload);
        return payload + crc.toUpperCase();
    }

    function crc16(str) {
        let crc = 0xFFFF;
        for (let c = 0; c < str.length; c++) {
            let b = str.charCodeAt(c);
            for (let i = 0; i < 8; i++) {
                let bit = ((b >> (7 - i) & 1) == 1);
                let c15 = ((crc >> 15 & 1) == 1);
                crc <<= 1;
                if (c15 ^ bit) crc ^= 0x1021;
            }
        }
        crc &= 0xFFFF;
        return crc.toString(16).padStart(4, '0');
    }
</script>

</body>
</html>
