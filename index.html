<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงทะเบียนพยาบาล / ผู้บริบาลหางานเฝ้าไข้</title>
    <!-- ใช้ Tailwind CSS สำหรับตกแต่งหน้าตาเว็บ -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-2xl shadow-lg max-w-md w-full border border-gray-100">
        <!-- หัวข้อ -->
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-blue-600 mb-2">ลงทะเบียนเข้ากลุ่มหางาน</h1>
            <p class="text-gray-500 text-sm">เพื่อป้องกันมิจฉาชีพ ระบบจำเป็นต้องตรวจสอบใบประกอบวิชาชีพก่อนเข้ากลุ่มพูดคุย</p>
        </div>

        <!-- ฟอร์มลงทะเบียน -->
        <form id="registerForm" class="space-y-5">
            
            <!-- ชื่อ-นามสกุล -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">ชื่อ - นามสกุลจริง *</label>
                <input type="text" id="fullname" required 
                    class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition"
                    placeholder="นาย/นาง/นางสาว ดีใจ เกิดมาดี">
            </div>

            <!-- เบอร์โทรศัพท์ -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">เบอร์โทรศัพท์ที่ติดต่อได้ *</label>
                <input type="tel" id="phone" required pattern="[0-9]{10}"
                    class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition"
                    placeholder="0812345678">
            </div>

            <!-- เลขที่ใบประกอบวิชาชีพ -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">เลขที่ใบอนุญาตประกอบวิชาชีพ *</label>
                <input type="text" id="licenseNo" required 
                    class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition"
                    placeholder="เช่น 6011xxxxxx">
            </div>

            <!-- อัปโหลดรูปภาพใบประกอบ -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">แนบรูปถ่ายใบประกอบวิชาชีพ *</label>
                <p class="text-xs text-amber-600 mb-2">⚠️ แนะนำให้เขียนลายน้ำทับว่า "ใช้สำหรับสมัครเข้ากลุ่มงานเฝ้าไข้เท่านั้น"</p>
                <div class="flex items-center justify-center w-full">
                    <label class="flex flex-col items-center justify-center w-full h-32 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100 transition">
                        <div class="flex flex-col items-center justify-center pt-5 pb-6">
                            <svg class="w-8 h-8 mb-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                            <p class="text-sm text-gray-500"><span class="font-semibold">คลิกเพื่ออัปโหลดรูปภาพ</span></p>
                            <p class="text-xs text-gray-400">PNG, JPG (ไม่เกิน 5MB)</p>
                        </div>
                        <input type="file" id="licenseImage" accept="image/*" required class="hidden" />
                    </label>
                </div>
                <!-- แสดงชื่อไฟล์ที่เลือก -->
                <div id="fileNameDisplay" class="text-sm text-gray-600 mt-2 hidden"></div>
            </div>

            <!-- ข้อตกลงความปลอดภัย (PDPA) -->
            <div class="flex items-start">
                <div class="flex items-center h-5">
                    <input type="checkbox" id="privacyAgree" required class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                </div>
                <div class="ml-3 text-xs text-gray-500">
                    <label for="privacyAgree">ฉันยินยอมให้ผู้ดูแลระบบตรวจสอบข้อมูลเพื่อความปลอดภัย และข้อมูลนี้จะถูกเก็บเป็นความลับ</label>
                </div>
            </div>

            <!-- ปุ่มส่งข้อมูล -->
            <button type="submit" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-lg transition shadow-md hover:shadow-lg">
                ส่งข้อมูลเพื่อขออนุมัติเข้ากลุ่ม
            </button>
        </form>

        <!-- ข้อความเมื่อส่งสำเร็จ -->
        <div id="successMessage" class="hidden text-center py-8 space-y-4">
            <div class="w-16 h-16 bg-green-100 text-green-500 rounded-full flex items-center justify-center mx-auto text-3xl font-bold">✓</div>
            <h2 class="text-xl font-bold text-gray-800">ส่งข้อมูลสำเร็จ!</h2>
            <p class="text-gray-500 text-sm">แอดมินกำลังตรวจสอบใบประกอบวิชาชีพของท่าน หากถูกต้อง ลิงก์เข้ากลุ่มแชทส่งงานจะถูกส่งให้ท่านทันที</p>
        </div>
    </div>

    <script>
        // แสดงชื่อไฟล์เมื่อผู้ใช้เลือกรูป
        const fileInput = document.getElementById('licenseImage');
        const fileDisplay = document.getElementById('fileNameDisplay');
        
        fileInput.addEventListener('change', (e) => {
            if(e.target.files.length > 0) {
                fileDisplay.textContent = `ไฟล์ที่เลือก: ${e.target.files[0].name}`;
                fileDisplay.classList.remove('hidden');
            }
        });

        // จัดการเมื่อกดปุ่ม Submit ฟอร์ม
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault(); // ป้องกันหน้าเว็บรีเฟรช

            // ดึงค่าจากฟอร์มมาเตรียมส่งต่อ
            const fullname = document.getElementById('fullname').value;
            const phone = document.getElementById('phone').value;
            const licenseNo = document.getElementById('licenseNo').value;
            const licenseFile = fileInput.files[0];

            // --- จังหวะนี้ในอนาคต: เขียนโค้ดส่งข้อมูลไปเก็บที่ฐานข้อมูล (เช่น Firebase / Supabase) ---
            console.log("ส่งข้อมูล:", { fullname, phone, licenseNo, fileName: licenseFile.name });

            // ซ่อนฟอร์ม แล้วแสดงข้อความสำเร็จ
            document.getElementById('registerForm').classList.add('hidden');
            document.getElementById('successMessage').classList.remove('hidden');
        });
    </script>
</body>
</html>
