<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NXRT Digital Bank</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap');
    body { font-family: 'Kanit', sans-serif; }
    .glass {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <!-- Mobile App Frame Container -->
  <div class="w-full max-w-md bg-slate-900 rounded-3xl border border-slate-800 shadow-2xl overflow-hidden relative min-h-[750px] flex flex-col justify-between">
    
    <!-- Top Header Bar -->
    <div class="p-6 pb-2 flex justify-between items-center">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center font-bold text-white shadow-lg shadow-cyan-500/30">N</div>
        <span class="font-semibold text-lg tracking-wider text-white">NXRT<span class="text-cyan-400">BANK</span></span>
      </div>
      <i data-lucide="bell" class="w-5 h-5 text-slate-400 hover:text-white cursor-pointer transition"></i>
    </div>

    <!-- Main Content Area -->
    <div id="main-content" class="p-6 space-y-6 flex-1">
      
      <!-- Balance Card -->
      <div class="glass rounded-2xl p-6 relative overflow-hidden bg-gradient-to-br from-slate-800/80 to-slate-900/80 shadow-xl">
        <div class="absolute -right-10 -bottom-10 w-32 h-32 bg-cyan-500/10 rounded-full blur-2xl"></div>
        <p class="text-xs text-slate-400 font-light uppercase tracking-wider">ยอดเงินที่ใช้ได้</p>
        <div class="flex items-baseline gap-2 mt-2">
          <span class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-white via-slate-100 to-cyan-400" id="balance-display">
            1,000,000,000,000.00
          </span>
          <span class="text-sm text-cyan-400 font-medium">THB</span>
        </div>
        <p class="text-[10px] text-slate-500 mt-4">เลขที่บัญชี: 888-0-99999-0</p>
      </div>

      <!-- Quick Action Buttons -->
      <div class="grid grid-cols-4 gap-3">
        <button onclick="openModal()" class="flex flex-col items-center gap-2 group">
          <div class="w-12 h-12 rounded-2xl bg-cyan-500/10 border border-cyan-500/20 flex items-center justify-center text-cyan-400 group-hover:bg-cyan-500 group-hover:text-slate-950 transition-all duration-300 shadow-lg shadow-cyan-500/5">
            <i data-lucide="send" class="w-5 h-5"></i>
          </div>
          <span class="text-xs text-slate-300">โอนเงิน</span>
        </button>
        <button class="flex flex-col items-center gap-2 group">
          <div class="w-12 h-12 rounded-2xl bg-slate-800/80 border border-slate-700/50 flex items-center justify-center text-slate-300 group-hover:border-slate-500 transition-all">
            <i data-lucide="qr-code" class="w-5 h-5"></i>
          </div>
          <span class="text-xs text-slate-400">สแกน</span>
        </button>
        <button class="flex flex-col items-center gap-2 group">
          <div class="w-12 h-12 rounded-2xl bg-slate-800/80 border border-slate-700/50 flex items-center justify-center text-slate-300 group-hover:border-slate-500 transition-all">
            <i data-lucide="wallet" class="w-5 h-5"></i>
          </div>
          <span class="text-xs text-slate-400">เติมเงิน</span>
        </button>
        <button class="flex flex-col items-center gap-2 group">
          <div class="w-12 h-12 rounded-2xl bg-slate-800/80 border border-slate-700/50 flex items-center justify-center text-slate-300 group-hover:border-slate-500 transition-all">
            <i data-lucide="more-horizontal" class="w-5 h-5"></i>
          </div>
          <span class="text-xs text-slate-400">เพิ่มเติม</span>
        </button>
      </div>

      <!-- Transaction History Placeholder -->
      <div class="space-y-3 pt-2">
        <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">รายการล่าสุด</h3>
        <div class="glass rounded-xl p-3 flex justify-between items-center text-sm">
          <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-full bg-emerald-500/10 flex items-center justify-center text-emerald-400">
              <i data-lucide="arrow-down-left" class="w-4 h-4"></i>
            </div>
            <div>
              <p class="font-medium text-slate-200">รับโอนจาก System</p>
              <p class="text-[10px] text-slate-500">วันนี้ 10:00 น.</p>
            </div>
          </div>
          <span class="text-emerald-400 font-semibold">+1,000,000,000,000</span>
        </div>
      </div>

    </div>

    <!-- Transfer Modal -->
    <div id="transfer-modal" class="hidden absolute inset-0 bg-slate-950/90 backdrop-blur-md z-20 p-6 flex-col justify-center space-y-4">
      <div class="flex justify-between items-center mb-2">
        <h2 class="text-lg font-bold text-white">โอนเงิน (NXRT Transfer)</h2>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-6 h-6"></i></button>
      </div>
      
      <div class="space-y-3">
        <div>
          <label class="text-xs text-slate-400 mb-1 block">เลขบัญชีผู้รับ</label>
          <input type="text" id="acc-input" placeholder="ระบุเลขบัญชี 10 หลัก" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-cyan-500 text-white">
        </div>
        <div>
          <label class="text-xs text-slate-400 mb-1 block">จำนวนเงิน (บาท)</label>
          <input type="number" id="amount-input" placeholder="0.00" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-cyan-500 text-white">
        </div>
      </div>

      <button onclick="processTransfer()" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 text-slate-950 font-bold py-3 rounded-xl hover:opacity-90 transition mt-4 shadow-lg shadow-cyan-500/20">
        ยืนยันการโอนเงิน
      </button>
    </div>

    <!-- Receipt Modal (E-Slip) -->
    <div id="slip-modal" class="hidden absolute inset-0 bg-slate-950 z-30 p-6 flex flex-col items-center justify-center">
      <div class="w-full max-w-xs bg-slate-100 text-slate-800 rounded-2xl p-6 shadow-2xl relative space-y-4">
        <!-- Slip Header -->
        <div class="text-center border-b border-slate-200 pb-3">
          <div class="w-10 h-10 bg-cyan-600 rounded-full flex items-center justify-center mx-auto mb-2 text-white font-bold">N</div>
          <h4 class="font-bold text-cyan-700">ทำรายการสำเร็จ</h4>
          <p class="text-[10px] text-slate-400" id="slip-date"></p>
        </div>

        <!-- Slip Body -->
        <div class="space-y-3 text-xs">
          <div>
            <p class="text-slate-400 text-[10px]">ผู้โอน</p>
            <p class="font-semibold text-slate-700">นาย NXRT User (888-0-99999-0)</p>
          </div>
          <div>
            <p class="text-slate-400 text-[10px]">ผู้รับโอน</p>
            <p class="font-semibold text-slate-700" id="slip-receiver"></p>
          </div>
          <div class="border-t border-dashed border-slate-300 pt-3 flex justify-between items-baseline">
            <span class="text-slate-500">จำนวนเงิน</span>
            <span class="text-base font-bold text-cyan-700" id="slip-amount"></span>
          </div>
          <div class="flex justify-between items-center text-[10px] text-slate-400">
            <span>รหัสอ้างอิง</span>
            <span id="slip-ref"></span>
          </div>
        </div>

        <!-- Button -->
        <button onclick="closeSlip()" class="w-full bg-slate-800 text-white font-medium py-2 rounded-xl text-xs mt-4">
          เสร็จสิ้น
        </button>
      </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="p-4 border-t border-slate-800/80 bg-slate-900/50 flex justify-around items-center text-slate-500">
      <i data-lucide="home" class="w-5 h-5 text-cyan-400"></i>
      <i data-lucide="pie-chart" class="w-5 h-5 hover:text-slate-300 cursor-pointer"></i>
      <i data-lucide="credit-card" class="w-5 h-5 hover:text-slate-300 cursor-pointer"></i>
      <i data-lucide="user" class="w-5 h-5 hover:text-slate-300 cursor-pointer"></i>
    </div>

  </div>

  <script>
    // Initialize Icons
    lucide.createIcons();

    // Initial Balance (1,000,000,000,000 THB = 1 ล้านล้านบาท)
    let currentBalance = 1000000000000;

    function formatNumber(num) {
      return num.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function openModal() {
      document.getElementById('transfer-modal').classList.remove('hidden');
      document.getElementById('transfer-modal').classList.add('flex');
    }

    function closeModal() {
      document.getElementById('transfer-modal').classList.add('hidden');
      document.getElementById('transfer-modal').classList.remove('flex');
    }

    function closeSlip() {
      document.getElementById('slip-modal').classList.add('hidden');
    }

    function processTransfer() {
      const acc = document.getElementById('acc-input').value;
      const amount = parseFloat(document.getElementById('amount-input').value);

      if (!acc || isNaN(amount) || amount <= 0) {
        alert('กรุณากรอกข้อมูลให้ครบถ้วนและถูกต้อง');
        return;
      }

      if (amount > currentBalance) {
        alert('ยอดเงินในบัญชีไม่พอ');
        return;
      }

      // Deduct Balance
      currentBalance -= amount;
      document.getElementById('balance-display').innerText = formatNumber(currentBalance);

      // Generate Slip Data
      const now = new Date();
      document.getElementById('slip-date').innerText = now.toLocaleString('th-TH');
      document.getElementById('slip-receiver').innerText = `บัญชี X-${acc.slice(-4) || '1234'}`;
      document.getElementById('slip-amount').innerText = `${formatNumber(amount)} บาท`;
      document.getElementById('slip-ref').innerText = 'NX' + Math.floor(Math.random() * 1000000000);

      // Reset Inputs & Close Modal
      document.getElementById('acc-input').value = '';
      document.getElementById('amount-input').value = '';
      closeModal();

      // Show Slip Modal
      document.getElementById('slip-modal').classList.remove('hidden');
    }
  </script>
</body>
</html>
