    <style>
        @page {
            size: A5 landscape;
            margin: 8mm 10mm;
            background-color: #ffffff;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            font-family: 'Sarabun', 'Cordia New', 'TH Sarabun PSK', sans-serif;
            color: #111;
            margin: 0;
            padding: 0;
            font-size: 9.5pt;
            line-height: 1.25;
            background-color: #fff;
        }

        /* ปุ่มกดส่งออก PDF / พิมพ์ */
        .no-print {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 9999;
        }

        .btn-pdf {
            background-color: #0066cc;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-pdf:hover {
            background-color: #004b99;
        }

        @media print {
            .no-print {
                display: none !important;
            }
        }
