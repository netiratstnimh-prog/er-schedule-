<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบตรวจสอบรายชื่อผู้ช่วยพยาบาล (PN Verification)</title>
    <style>
        * { box-sizing: border-box; font-family: 'Sarabun', 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        body { background-color: #f4f7f6; color: #333; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h1 { text-align: center; color: #1e56a0; margin-bottom: 20px; font-size: 24px; }
        .nav-tabs { display: flex; border-bottom: 2px solid #e0e0e0; margin-bottom: 25px; }
        .tab-btn { flex: 1; padding: 12px; text-align: center; background: none; border: none; font-size: 16px; font-weight: bold; cursor: pointer; color: #666; }
        .tab-btn.active { color: #1e56a0; border-bottom: 3px solid #1e56a0; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #444; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
        button.btn-submit { width: 100%; padding: 12px; background: #1e56a0; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button.btn-submit:hover { background: #163e75; }
        
        .result-card { border: 1px solid #dcdcdc; padding: 18px; border-radius: 8px; background: #fafafa; margin-top: 20px; }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; }
        .badge-verified { background: #d4edda; color: #155724; }
        .badge-notfound { background: #f8d7da; color: #721c24; }
        .info-row { margin: 8px 0; font-size: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1>ระบบตรวจสอบรายชื่อผู้ช่วยพยาบาล (PN)</h1>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('search')">🔍 ค้นหา/ตรวจสอบรายชื่อ</button>
        <button class="tab-btn" onclick="switchTab('register')">📝 ลงทะเบียนยืนยันวุฒิ</button>
    </div>

    <!-- แท็บที่ 1: ค้นหาข้อมูล -->
    <div id="search" class="tab-content active">
        <div class="form-group">
            <label for="searchQuery">ค้นหาด้วย ชื่อ-นามสกุล หรือ เลขบัตรประชาชน:</label>
            <input type="text" id="searchQuery" placeholder="เช่น ศิริพร ใจดี หรือ 1100200300400">
        </div>
        <button class="btn-submit" onclick="performSearch()">ค้นหาข้อมูล</button>

        <div id="searchResult" style="display:none;"></div>
    </div>

    <!-- แท็บที่ 2: ลงทะเบียน -->
    <div id="register" class="tab-content">
        <form onsubmit="handleRegister(event)">
            <div class="form-group">
                <label>ชื่อ-นามสกุล:</label>
                <input type="text" id="regName" required placeholder="นาย/นาง/นางสาว...">
            </div>
            <div class="form-group">
                <label>เลขประจำตัวประชาชน (13 หลัก):</label>
                <input type="text" id="regIdCard" maxlength="13" required placeholder="เลข 13 หลัก">
            </div>
            <div class="form-group">
                <label>สถาบันที่สำเร็จการศึกษา:</label>
                <input type="text" id="regSchool" required placeholder="ชื่อโรงเรียน/คณะ/วิทยาลัย">
            </div>
            <div class="form-group">
                <label>ปี พ.ศ. ที่สำเร็จการศึกษา:</label>
                <input type="number" id="regYear" required placeholder="เช่น 2566">
            </div>
            <div class="form-group">
                <label>เลขที่ใบประกาศนียบัตร:</label>
                <input type="text" id="regCert" required placeholder="เช่น PN-2566-0012">
            </div>
            <div class="form-group">
                <label>แนบไฟล์ใบประกาศนียบัตร/เอกสารยืนยันตัวตน (PDF/JPG):</label>
                <input type="file" required>
            </div>
            <button type="submit" class="btn-submit">ส่งข้อมูลเข้าระบบตรวจสอบ</button>
        </form>
    </div>
</div>

<script>
    // จำลองฐานข้อมูล
    const database = [
        { name: "ศิริพร ใจดี", idCard: "1100200300400", school: "คณะพยาบาลศาสตร์ มหาวิทยาลัยเชียงใหม่", year: "2565", cert: "PN65-0102", status: "Verified" },
        { name: "สมชาย รักดี", idCard: "2200300400500", school: "วิทยาลัยพยาบาลบรมราชชนนี", year: "2566", cert: "PN66-0541", status: "Verified" }
    ];

    function switchTab(tabName) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tabName).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    function performSearch() {
        const query = document.getElementById('searchQuery').value.trim();
        const resultDiv = document.getElementById('searchResult');
        resultDiv.style.display = 'block';

        if (!query) {
            resultDiv.innerHTML = '<div class="result-card"><p>กรุณากรอกข้อมูลเพื่อค้นหา</p></div>';
            return;
        }

        const found = database.find(item => item.name.includes(query) || item.idCard === query);

        if (found) {
            resultDiv.innerHTML = `
                <div class="result-card">
                    <span class="badge badge-verified">✓ ยืนยันแล้วในระบบ (Verified)</span>
                    <div class="info-row" style="margin-top:12px;"><strong>ชื่อ-นามสกุล:</strong> ${found.name}</div>
                    <div class="info-row"><strong>สถาบันที่จบ:</strong> ${found.school}</div>
                    <div class="info-row"><strong>ปีที่สำเร็จการศึกษา:</strong> พ.ศ. ${found.year}</div>
                    <div class="info-row"><strong>เลขที่ประกาศนียบัตร:</strong> ${found.cert}</div>
                </div>
            `;
        } else {
            resultDiv.innerHTML = `
                <div class="result-card">
                    <span class="badge badge-notfound">✕ ไม่พบข้อมูลในระบบ</span>
                    <p style="margin-top:10px; color:#666; font-size:14px;">ไม่พบข้อมูลผู้สำเร็จการศึกษาตามเงื่อนไขที่ค้นหา กรุณาตรวจสอบการสะกดชื่อ-นามสกุล หรือติดต่อสถาบันผู้จัดอบรมเพื่อยืนยันข้อมูล</p>
                </div>
            `;
        }
    }

    function handleRegister(e) {
        e.preventDefault();
        const newRecord = {
            name: document.getElementById('regName').value,
            idCard: document.getElementById('regIdCard').value,
            school: document.getElementById('regSchool').value,
            year: document.getElementById('regYear').value,
            cert: document.getElementById('regCert').value,
            status: "Verified"
        };
        database.push(newRecord);
        alert("ลงทะเบียนสำเร็จ! ข้อมูลของคุณเข้าสู่ระบบจำลองแล้ว คุณสามารถลองค้นหารายชื่อของคุณที่แท็บ 'ค้นหา' ได้ทันที");
        switchTab('search');
        document.getElementById('searchQuery').value = newRecord.name;
        performSearch();
    }
</script>

</body>
</html>
