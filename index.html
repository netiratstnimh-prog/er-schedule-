<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบบริหารเวรโรงพยาบาล - Soft UI App</title>
    <!-- FontAwesome & Google Fonts -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-app: #e0f2fe;
            --soft-bg: #e2f1fc;
            --primary-blue: #0284c7;
            --accent-blue: #0369a1;
            --text-dark: #1e3a8a;
            --text-muted: #64748b;
            
            /* Neumorphism Shadow Effect */
            --shadow-flat: 8px 8px 16px #c4dbe8, -8px -8px 16px #ffffff;
            --shadow-inset: inset 4px 4px 8px #c4dbe8, inset -4px -4px 8px #ffffff;
            --shadow-btn: 5px 5px 12px #badaf0, -5px -5px 12px #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-app);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        /* Smartphone App Wrapper Container */
        .app-frame {
            width: 100%;
            max-width: 420px;
            background-color: var(--soft-bg);
            border-radius: 35px;
            box-shadow: 15px 15px 30px #b0ccdf, -15px -15px 30px #ffffff;
            padding: 20px 18px 80px 18px;
            position: relative;
            min-height: 840px;
            display: flex;
            flex-direction: column;
            border: 4px solid #ffffff;
        }

        /* Top Header Area */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .user-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--soft-bg);
            box-shadow: var(--shadow-btn);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--primary-blue);
            font-size: 1.2rem;
        }

        .hospital-brand-info {
            text-align: center;
        }

        .hosp-name-text {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-dark);
        }

        .internal-tag {
            font-size: 0.68rem;
            color: #ef4444;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-weight: 500;
        }

        .red-dot {
            width: 7px;
            height: 7px;
            background-color: #ef4444;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.7; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.7; }
        }

        /* Soft Cards */
        .soft-card {
            background: var(--soft-bg);
            border-radius: 20px;
            box-shadow: var(--shadow-flat);
            padding: 16px;
            margin-bottom: 16px;
        }

        .card-header-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--primary-blue);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Inputs & Select Neumorphic Inset */
        .soft-input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 15px;
            border: none;
            background: var(--soft-bg);
            box-shadow: var(--shadow-inset);
            outline: none;
            color: var(--text-dark);
            font-size: 0.85rem;
            margin-bottom: 10px;
        }

        /* Buttons Neumorphic */
        .soft-btn {
            width: 100%;
            padding: 12px;
            border-radius: 20px;
            border: none;
            background: linear-gradient(145deg, #0284c7, #0369a1);
            color: white;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 4px 4px 10px #badaf0, -4px -4px 10px #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .soft-btn:active {
            transform: scale(0.98);
            box-shadow: var(--shadow-inset);
        }

        /* Roster Timeline List Style */
        .roster-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--soft-bg);
            box-shadow: var(--shadow-btn);
            padding: 10px 14px;
            border-radius: 16px;
            margin-bottom: 10px;
        }

        .time-box {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--primary-blue);
            text-align: center;
            padding-right: 10px;
            border-right: 2px solid #cbd5e1;
        }

        .staff-detail {
            flex-grow: 1;
            padding-left: 12px;
        }

        .staff-name { font-size: 0.82rem; font-weight: 600; }
        .staff-sub { font-size: 0.7rem; color: var(--text-muted); }

        .shift-pill {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 600;
            box-shadow: var(--shadow-btn);
        }

        .shift-m { background-color: #fef3c7; color: #d97706; }
        .shift-a { background-color: #ffedd5; color: #ea580c; }
        .shift-n { background-color: #e0e7ff; color: #4f46e5; }

        /* Floating Action Button (HELP) */
        .fab-help {
            position: absolute;
            bottom: 75px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--soft-bg);
            box-shadow: var(--shadow-btn);
            color: var(--primary-blue);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border: none;
            font-size: 0.65rem;
            font-weight: bold;
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: absolute;
            bottom: 12px;
            left: 18px;
            right: 18px;
            height: 60px;
            background: var(--soft-bg);
            border-radius: 25px;
            box-shadow: var(--shadow-flat);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 10px;
        }

        .nav-item {
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
        }

        .nav-item.active {
            color: var(--primary-blue);
            box-shadow: var(--shadow-inset);
        }

        /* Modal Soft UI */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(224, 242, 254, 0.7);
            backdrop-filter: blur(5px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-box {
            background: var(--soft-bg);
            border-radius: 25px;
            box-shadow: var(--shadow-flat);
            padding: 20px;
            width: 100%;
            max-width: 360px;
        }
    </style>
</head>
<body>

    <!-- Smartphone App Frame -->
    <div class="app-frame">
        
        <!-- App Header -->
        <div class="app-header">
            <div class="user-avatar" onclick="openModal('modal-login')">
                <i class="fa-solid fa-user"></i>
            </div>
            <div class="hospital-brand-info">
                <div class="hosp-name-text" id="display-hosp-name">🏥 รพ. ศิริราชพยาบาล</div>
                <div class="internal-tag">
                    <div class="red-dot"></div> Specific Internal Only
                </div>
            </div>
            <div class="user-avatar" onclick="openModal('modal-hosp-config')">
                <i class="fa-solid fa-sliders"></i>
            </div>
        </div>

        <!-- Realtime Clock Box -->
        <div class="soft-card" style="padding: 10px 15px; text-align: center; margin-bottom: 12px;">
            <div id="clock-text" style="font-size: 0.85rem; font-weight: 600; color: var(--primary-blue);">
                <i class="fa-regular fa-clock"></i> 00:00:00 น.
            </div>
        </div>

        <!-- Department Selector -->
        <div class="soft-card" style="padding: 10px;">
            <select class="soft-input" id="dept-select" style="margin-bottom: 0;" onchange="renderRoster()">
                <option value="ER">แผนกฉุกเฉิน (ER)</option>
                <option value="ICU">แผนกผู้ป่วยหนัก (ICU)</option>
                <option value="OPD">แผนกผู้ป่วยนอก (OPD)</option>
                <option value="OR">ห้องผ่าตัด (OR)</option>
            </select>
        </div>

        <!-- Roster Timeline View (App Center View) -->
        <div class="soft-card" style="flex-grow: 1; overflow-y: auto;">
            <div class="card-header-title">
                <i class="fa-solid fa-calendar-day"></i> ตารางเวรวันนี้ (<span id="dept-label">ER</span>)
            </div>
            
            <div id="roster-list">
                <!-- Dynamic Roster Items -->
            </div>
        </div>

        <!-- Floating HELP Button -->
        <button class="fab-help" onclick="alert('ระบบช่วยเหลือ: ติดต่อแอดมิน โทร 1111 หรือ แอดไลน์ @HospitalRoster')">
            <i class="fa-solid fa-circle-question fa-lg"></i>
            <span>HELP</span>
        </button>

        <!-- Bottom Navigation Bar -->
        <div class="bottom-nav">
            <div class="nav-item active" onclick="switchTab(this)"><i class="fa-solid fa-calendar-days"></i></div>
            <div class="nav-item" onclick="openModal('modal-hosp-config')"><i class="fa-solid fa-hospital"></i></div>
            <div class="nav-item" onclick="openModal('modal-add-staff')"><i class="fa-solid fa-plus"></i></div>
            <div class="nav-item" onclick="triggerNFC()"><i class="fa-solid fa-wifi"></i></div>
            <div class="nav-item" onclick="openModal('modal-login')"><i class="fa-solid fa-user-lock"></i></div>
        </div>

    </div>

    <!-- MODAL: จัดการชื่อโรงพยาบาล & เพิ่มแผนก -->
    <div class="modal" id="modal-hosp-config">
        <div class="modal-box">
            <div style="display:flex; justify-content:space-between; margin-bottom:12px;">
                <h3 style="font-size:0.95rem; color:var(--primary-blue);"><i class="fa-solid fa-hospital"></i> ตั้งค่าโรงพยาบาล/แผนก</h3>
                <span onclick="closeModal('modal-hosp-config')" style="cursor:pointer;">&times;</span>
            </div>
            <form onsubmit="handleSaveHosp(event)">
                <label style="font-size:0.75rem; font-weight:600; color:var(--text-muted);">ชื่อโรงพยาบาล</label>
                <input type="text" class="soft-input" id="input-hosp-name" value="รพ. ศิริราชพยาบาล" required>
                
                <label style="font-size:0.75rem; font-weight:600; color:var(--text-muted);">เพิ่มแผนกใหม่</label>
                <input type="text" class="soft-input" id="input-new-dept" placeholder="เช่น แผนกเคมีบำบัด">
                
                <button type="submit" class="soft-btn">บันทึกข้อมูล</button>
            </form>
        </div>
    </div>

    <!-- MODAL: เข้าสู่ระบบ (Admin RN1323) -->
    <div class="modal" id="modal-login">
        <div class="modal-box">
            <div style="display:flex; justify-content:space-between; margin-bottom:12px;">
                <h3 style="font-size:0.95rem; color:var(--primary-blue);"><i class="fa-solid fa-lock"></i> เข้าสู่ระบบเจ้าหน้าที่</h3>
                <span onclick="closeModal('modal-login')" style="cursor:pointer;">&times;</span>
            </div>
            <form onsubmit="handleLogin(event)">
                <input type="text" class="soft-input" id="login-user" placeholder="Username (เช่น RN1323)" required>
                <input type="password" class="soft-input" id="login-pass" placeholder="Password (เช่น 1323)" required>
                <button type="submit" class="soft-btn">ลงชื่อเข้าใช้</button>
            </form>
        </div>
    </div>

    <!-- MODAL: เพิ่มบุคลากร -->
    <div class="modal" id="modal-add-staff">
        <div class="modal-box">
            <div style="display:flex; justify-content:space-between; margin-bottom:12px;">
                <h3 style="font-size:0.95rem; color:var(--primary-blue);"><i class="fa-solid fa-user-plus"></i> เพิ่มเจ้าหน้าที่</h3>
                <span onclick="closeModal('modal-add-staff')" style="cursor:pointer;">&times;</span>
            </div>
            <form onsubmit="handleAddStaff(event)">
                <input type="text" class="soft-input" id="staff-name" placeholder="ชื่อ-นามสกุล" required>
                <input type="text" class="soft-input" id="staff-id" placeholder="รหัสพนักงาน (Username)" required>
                <input type="text" class="soft-input" value="รหัสผ่านเริ่มต้น: NRT12345#" disabled>
                <button type="submit" class="soft-btn">บันทึกบุคลากร</button>
            </form>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        const staffList = [
            { id: 'RN1323', name: 'พว. หัวหน้าผู้ดูแลระบบ', time: '08:00 - 16:00', shift: '☀️ เช้า', class: 'shift-m' },
            { id: 'RN1001', name: 'พว. สุภาพร กลิ่นหอม', time: '16:00 - 24:00', shift: '🌅 บ่าย', class: 'shift-a' },
            { id: 'RN1002', name: 'พว. ณัฐวุฒิ ใจดี', time: '24:00 - 08:00', shift: '🌙 ดึก', class: 'shift-n' }
        ];

        // 1. Clock
        function updateClock() {
            const now = new Date();
            document.getElementById('clock-text').innerHTML = `<i class="fa-regular fa-clock"></i> ${now.toLocaleTimeString('th-TH')} น.`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 2. Modals
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        // 3. Render Roster Timeline
        function renderRoster() {
            const list = document.getElementById('roster-list');
            const dept = document.getElementById('dept-select').value;
            document.getElementById('dept-label').innerText = dept;

            list.innerHTML = staffList.map(s => `
                <div class="roster-item">
                    <div class="time-box">${s.time.split('-')[0]}<br><small style="font-size:0.65rem; color:#64748b;">น.</small></div>
                    <div class="staff-detail">
                        <div class="staff-name">${s.name}</div>
                        <div class="staff-sub">${s.id} • ${s.time}</div>
                    </div>
                    <span class="shift-pill ${s.class}">${s.shift}</span>
                </div>
            `).join('');
        }

        // 4. Save Hosp & Add Dept
        function handleSaveHosp(e) {
            e.preventDefault();
            const hName = document.getElementById('input-hosp-name').value;
            const newDept = document.getElementById('input-new-dept').value;

            document.getElementById('display-hosp-name').innerText = '🏥 ' + hName;

            if(newDept.trim() !== '') {
                const select = document.getElementById('dept-select');
                const opt = document.createElement('option');
                opt.value = newDept;
                opt.innerText = newDept;
                select.appendChild(opt);
                select.value = newDept;
                document.getElementById('input-new-dept').value = '';
            }

            closeModal('modal-hosp-config');
            renderRoster();
            alert('บันทึกการตั้งค่าโรงพยาบาลเรียบร้อย');
        }

        // 5. Auth (RN1323 / 1323)
        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('login-user').value;
            const p = document.getElementById('login-pass').value;

            if(u === 'RN1323' && p === '1323') {
                alert('ยินดีต้อนรับผู้ดูแลระบบ RN1323 เข้าสู่ระบบ');
            } else {
                alert('ลงชื่อเข้าใช้สำเร็จสำหรับเจ้าหน้าที่ทั่วไป');
            }
            closeModal('modal-login');
        }

        function handleAddStaff(e) {
            e.preventDefault();
            const name = document.getElementById('staff-name').value;
            const id = document.getElementById('staff-id').value;
            staffList.push({ id, name, time: '08:00 - 16:00', shift: '☀️ เช้า', class: 'shift-m' });
            renderRoster();
            closeModal('modal-add-staff');
            alert('เพิ่มเจ้าหน้าที่เรียบร้อย');
        }

        function triggerNFC() {
            alert('กำลังแตะบัตรพนักงาน NFC...');
        }

        function switchTab(el) {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
        }

        renderRoster();
    </script>
</body>
</html>
