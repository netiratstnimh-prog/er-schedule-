<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบันทึกค่าใช้จ่าย & พิมพ์สลิปใบเสร็จ</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f3f4f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, 'Sarabun';
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h2 {
            margin-top: 0;
            color: #1e293b;
            font-size: 1.25rem;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 4px;
        }

        input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.95rem;
        }

        .item-row {
            display: flex;
            gap: 10px;
            margin-bottom: 8px;
        }

        .item-row input[type="text"] { flex: 2; }
        .item-row input[type="number"] { flex: 1; }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-add { background: #10b981; color: white; width: 100%; margin-top: 5px; }
        .btn-add:hover { background: #059669; }
        .btn-remove { background: #ef4444; color: white; padding: 8px 12px; }
        .btn-remove:hover { background: #dc2626; }
        .btn-print { background: var(--primary-color); color: white; flex: 1; }
        .btn-print:hover { background: #1d4ed8; }
        .btn-img { background: #8b5cf6; color: white; flex: 1; }
        .btn-img:hover { background: #7c3aed; }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        /* --- Receipt Printable Thermal Styling --- */
        .receipt-wrapper {
            display: flex;
            justify-content: center;
            background: #e2e8f0;
            padding: 15px;
            border-radius: 8px;
        }

        #receipt {
            width: 80mm; /* Standard Thermal Paper Size */
            background: #ffffff;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            color: #000;
        }

        .receipt-header {
            text-align: center;
            border-bottom: 1px dashed #000;
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .receipt-title { font-size: 14pt; font-weight: bold; margin: 0; }
        .receipt-sub { font-size: 8pt; margin: 2px 0; }

        .receipt-meta {
            font-size: 8pt;
            border-bottom: 1px dashed #000;
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .receipt-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 9pt;
            margin-bottom: 10px;
        }

        .receipt-table th { text-align: left; border-bottom: 1px solid #000; padding-bottom: 4px; }
        .receipt-table td { padding: 4px 0; border-bottom: 1px dotted #ccc; }
        .receipt-table .num { text-align: right; }

        .receipt-summary {
            border-top: 1px dashed #000;
            padding-top: 6px;
            font-size: 9pt;
        }

        .summary-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 3px;
        }

        .summary-line.total {
            font-size: 11pt;
            font-weight: bold;
            border-top: 1px solid #000;
            border-bottom: 2px double #000;
            padding: 4px 0;
            margin-top: 5px;
        }

        .receipt-footer {
            text-align: center;
            font-size: 8pt;
            margin-top: 15px;
            border-top: 1px dashed #000;
            padding-top: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>📝 กรอกข้อมูลค่าใช้จ่าย</h2>
        
        <div class="form-group">
            <label>หัวข้อ/ชื่อร้าน/แผนก:</label>
            <input type="text" id="inputTitle" value="สลิปบันทึกค่าใช้จ่าย" oninput="updateReceipt()">
        </div>

        <div class="form-group">
            <label>เลขที่รายการ:</label>
            <input type="text" id="inputNo" value="EXP-001" oninput="updateReceipt()">
        </div>

        <label>รายการค่าใช้จ่าย & จำนวนเงิน (บาท):</label>
        <div id="itemsContainer">
            <div class="item-row">
                <input type="text" class="item-name" value="ค่าอุปกรณ์สำนักงาน" placeholder="ชื่อรายการ" oninput="updateReceipt()">
                <input type="number" class="item-amount" value="350" placeholder="จำนวนเงิน" oninput="updateReceipt()">
                <button class="btn btn-remove" onclick="removeItem(this)">X</button>
            </div>
        </div>

        <button class="btn btn-add" onclick="addItem()">+ เพิ่มรายการ</button>

        <div class="actions">
            <button class="btn btn-print" onclick="downloadPDF()">📄 บันทึกเป็น PDF</button>
            <button class="btn btn-img" onclick="downloadImage()">🖼️ บันทึกเป็น รูปภาพ</button>
        </div>
    </div>

    <div class="card">
        <h2>🧾 ตัวอย่างสลิป (Preview)</h2>
        <div class="receipt-wrapper">
            <div id="receipt">
                <div class="receipt-header">
                    <div class="receipt-title" id="slipTitle">สลิปบันทึกค่าใช้จ่าย</div>
                    <div class="receipt-sub">EXPENSE RECEIPT</div>
                </div>

                <div class="receipt-meta">
                    <div><strong>วันที่:</strong> <span id="slipDate"></span></div>
                    <div><strong>เลขที่:</strong> <span id="slipNo">EXP-001</span></div>
                </div>

                <table class="receipt-table">
                    <thead>
                        <tr>
                            <th>รายการ</th>
                            <th class="num">จำนวนเงิน</th>
                        </tr>
                    </thead>
                    <tbody id="slipItems">
                        </tbody>
                </table>

                <div class="receipt-summary">
                    <div class="summary-line total">
                        <span>ยอดเงินสุทธิ:</span>
                        <span id="slipTotal">0.00</span>
                    </div>
                </div>

                <div class="receipt-footer">
                    <p>บันทึกระบบค่าใช้จ่ายภายใน</p>
                    <p>*** ขอบคุณครับ ***</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // ตั้งค่าวันที่ปัจจุบัน
    document.getElementById('slipDate').innerText = new Date().toLocaleDateString('th-TH', {
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit'
    });

    // เพิ่มแถวรายการ
    function addItem() {
        const container = document.getElementById('itemsContainer');
        const row = document.createElement('div');
        row.className = 'item-row';
        row.innerHTML = `
            <input type="text" class="item-name" placeholder="ชื่อรายการ" oninput="updateReceipt()">
            <input type="number" class="item-amount" placeholder="จำนวนเงิน" oninput="updateReceipt()">
            <button class="btn btn-remove" onclick="removeItem(this)">X</button>
        `;
        container.appendChild(row);
        updateReceipt();
    }

    // ลบแถวรายการ
    function removeItem(btn) {
        const rows = document.querySelectorAll('.item-row');
        if (rows.length > 1) {
            btn.parentElement.remove();
            updateReceipt();
        } else {
            alert('ต้องมีอย่างน้อย 1 รายการ');
        }
    }

    // อัปเดตข้อมูลบนใบเสร็จ & คำนวณยอดเงินสุทธิ
    function updateReceipt() {
        document.getElementById('slipTitle').innerText = document.getElementById('inputTitle').value || 'สลิปบันทึกค่าใช้จ่าย';
        document.getElementById('slipNo').innerText = document.getElementById('inputNo').value || '-';

        const names = document.querySelectorAll('.item-name');
        const amounts = document.querySelectorAll('.item-amount');
        const tbody = document.getElementById('slipItems');
        
        tbody.innerHTML = '';
        let grandTotal = 0;

        names.forEach((nameInput, index) => {
            const name = nameInput.value.trim() || 'รายการไม่ระบุ';
            const amount = parseFloat(amounts[index].value) || 0;
            grandTotal += amount;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${name}</td>
                <td class="num">${amount.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById('slipTotal').innerText = grandTotal.toLocaleString('th-TH', {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }) + ' บาท';
    }

    // บันทึกเป็น PDF
    function downloadPDF() {
        const element = document.getElementById('receipt');
        const opt = {
            margin:       0,
            filename:     'expense-slip-' + Date.now() + '.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 3 },
            jsPDF:        { unit: 'mm', format: [80, 150], orientation: 'portrait' }
        };
        html2pdf().set(opt).from(element).save();
    }

    // บันทึกเป็น รูปภาพ (PNG)
    function downloadImage() {
        const element = document.getElementById('receipt');
        html2canvas(element, { scale: 3 }).then(canvas => {
            const link = document.createElement('a');
            link.download = 'expense-slip-' + Date.now() + '.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    }

    // เริ่มต้นอัปเดตสลิปครั้งแรก
    updateReceipt();
</script>

</body>
</html>
