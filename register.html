<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MedCrew | สมาชิก</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#16343a;background:#f2f8f8}*{box-sizing:border-box}body{margin:0}header{background:#087e83;color:white;padding:28px 20px;text-align:center}header h1{margin:0;font-size:30px}header p{margin:6px 0 0}main{max-width:470px;margin:24px auto;padding:0 16px}.panel{background:white;border-radius:18px;padding:22px;box-shadow:0 5px 25px #1233}label{display:block;margin:14px 0 5px;font-weight:600}input,select,button{font:inherit;width:100%;padding:13px;border-radius:10px}input,select{border:1px solid #b9cdd0;background:white}button{margin-top:16px;background:#087e83;color:white;border:0;font-weight:650;cursor:pointer}button:disabled{opacity:.55}.secondary{background:#e5f2f2;color:#087e83}.status{margin:14px 0;padding:12px;background:#f0f6f7;border-radius:9px;white-space:pre-wrap;overflow-wrap:anywhere}.status:empty{display:none}a{color:#087e83}small{color:#566b70} [hidden]{display:none!important}
</style>
</head>
<body>
<header><h1>♡ MedCrew</h1><p>Healthcare Jobs Thailand</p></header>
<main><div class="panel">
<h2 id="heading">สมัครสมาชิก</h2>
<form id="authForm">
<div id="signupFields"><label for="displayName">ชื่อที่แสดง</label><input id="displayName" maxlength="100" autocomplete="name"><label for="memberType">ประเภทสมาชิก</label><select id="memberType"><option value="jobseeker">ผู้หางาน RN / PN / NA</option><option value="employer">ผู้ประกาศงาน</option></select></div>
<label for="email">อีเมล</label><input id="email" type="email" autocomplete="email" required>
<label for="password">รหัสผ่าน</label><input id="password" type="password" minlength="8" autocomplete="new-password" required>
<button id="submitButton" type="submit">สมัครสมาชิก</button></form>
<button id="toggleButton" class="secondary" type="button">มีบัญชีแล้ว? เข้าสู่ระบบ</button>
<div id="account" hidden><p id="accountInfo"></p><button id="logoutButton" type="button">ออกจากระบบ</button></div>
<div id="status" class="status" role="status" aria-live="polite"></div>
<p><a href="./index.html">← กลับหน้าค้นหางาน</a></p>
<small>โปรไฟล์ผู้ประกาศงานยังไม่ได้รับการยืนยันตัวตนจาก MedCrew</small>
</div></main>
<script type="module">
// เปลี่ยนเพียงสองค่าด้านล่าง โดยใช้ Publishable Key เท่านั้น

const SUPABASE_URL = 'https://chmkujuiqodkiptcjseq.supabase.co';

const SUPABASE_KEY = 'sb_publishable_5CpOijQGj5k9JLbSAxLaiQ_-cDKlmgu';
const $ = id => document.getElementById(id);
const status = message => { $('status').textContent = message; };
let client, loginMode = false;
const form = $('authForm');
$('toggleButton').addEventListener('click', () => {
  loginMode = !loginMode;
  $('signupFields').hidden = loginMode;
  $('heading').textContent = loginMode ? 'เข้าสู่ระบบ' : 'สมัครสมาชิก';
  $('submitButton').textContent = loginMode ? 'เข้าสู่ระบบ' : 'สมัครสมาชิก';
  $('toggleButton').textContent = loginMode ? 'ยังไม่มีบัญชี? สมัครสมาชิก' : 'มีบัญชีแล้ว? เข้าสู่ระบบ';
  $('password').autocomplete = loginMode ? 'current-password' : 'new-password';
  status('');
});
async function refresh() {
  const {data:{user},error} = await client.auth.getUser();
  if(error && error.name !== 'AuthSessionMissingError') throw error;
  form.hidden = Boolean(user);
  $('toggleButton').hidden = Boolean(user);
  $('account').hidden = !user;
  if(user){ $('accountInfo').textContent = 'เข้าสู่ระบบ: ' + user.email; }
}
form.addEventListener('submit', async event => {
  event.preventDefault();
  if(!client) return status('ยังไม่เชื่อมต่อ Supabase กรุณาตรวจสอบ URL และ Publishable Key');
  const button = $('submitButton'); button.disabled = true;
  status('กำลังดำเนินการ...');
  try {
    const email = $('email').value.trim();
    const password = $('password').value;
    if(loginMode){
      const {error} = await client.auth.signInWithPassword({email,password});
      if(error) throw error;
      await refresh(); status('เข้าสู่ระบบสำเร็จ');
    } else {
      const name = $('displayName').value.trim();
      const role = $('memberType').value;
      if(!name) throw new Error('กรุณากรอกชื่อที่แสดง');
      const {data,error} = await client.auth.signUp({
        email,password,
        options:{emailRedirectTo:location.origin+location.pathname,
          data:{display_name:name,member_type:role}}
      });
      if(error) throw error;
      if(data.session){
        await refresh(); status('สมัครสมาชิกสำเร็จ โปรดตรวจสอบโปรไฟล์ในฐานข้อมูล');
      } else {
        status('ส่งคำขอสมัครแล้ว หากได้รับอีเมลยืนยัน โปรดกดลิงก์ยืนยันก่อนเข้าสู่ระบบ');
      }
    }
  } catch(error){status('เกิดข้อผิดพลาด: '+(error?.message || String(error)));}
  finally{button.disabled=false;}
});
$('logoutButton').addEventListener('click', async () => {
  try{const {error}=await client.auth.signOut();if(error)throw error;await refresh();status('ออกจากระบบแล้ว');}
  catch(error){status('เกิดข้อผิดพลาด: '+error.message);}
});
try{
  if(!SUPABASE_URL.startsWith('https://') || SUPABASE_KEY.startsWith('YOUR_')){
    throw new Error('กรุณาใส่ Supabase URL และ Publishable Key ก่อน');
  }
  const {createClient} = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
  client = createClient(SUPABASE_URL,SUPABASE_KEY);
  client.auth.onAuthStateChange(() => { setTimeout(() => refresh().catch(e => status(e.message)),0); });
  await refresh();
} catch(error){status('ตั้งค่าหรือโหลด Supabase ไม่สำเร็จ: '+(error?.message||String(error)));}
</script>
</body></html>
